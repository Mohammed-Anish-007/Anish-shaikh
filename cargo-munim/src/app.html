<title>Cargo Munim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mukta:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first app shell — sticky header, one scrolling column, big picture tiles, fixed bottom nav with a big + button */
:root{
  --bg:#eaf1f2; --surface:#ffffff; --surface2:#f4f8f9; --ink:#0f2a3a; --muted:#566d7a; --line:#d2dfe3;
  --accent:#0a6b78; --accent-ink:#ffffff; --cargo:#d06a17; --cargo-bg:#fdecdc;
  --good:#16794a; --good-bg:#dff2e6; --bad:#bf3328; --bad-bg:#fbe3df; --warn:#9a6a00; --warn-bg:#fcefcc;
  --shadow:0 1px 2px rgba(15,42,58,.08),0 4px 14px rgba(15,42,58,.06);
  --f-display:"Baloo 2","Mukta",system-ui,sans-serif;
  --f-body:"Mukta","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1820; --surface:#12242e; --surface2:#0f1e27; --ink:#e4eef2; --muted:#94a9b4; --line:#23404c;
  --accent:#3fb3bf; --accent-ink:#04222a; --cargo:#f19a52; --cargo-bg:#3a2410;
  --good:#52c98a; --good-bg:#0f3220; --bad:#ff8074; --bad-bg:#3b1612; --warn:#f0c255; --warn-bg:#352909;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1820; --surface:#12242e; --surface2:#0f1e27; --ink:#e4eef2; --muted:#94a9b4; --line:#23404c;
  --accent:#3fb3bf; --accent-ink:#04222a; --cargo:#f19a52; --cargo-bg:#3a2410;
  --good:#52c98a; --good-bg:#0f3220; --bad:#ff8074; --bad-bg:#3b1612; --warn:#f0c255; --warn-bg:#352909;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.4;margin:0;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cargo);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--accent)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--accent);color:var(--accent-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .logo{font-size:30px;line-height:1}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:.2px;display:block;line-height:1.05}
.brand small{opacity:.85;font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{background:rgba(255,255,255,.16);border:0;border-radius:14px;min-width:48px;height:48px;padding:0 10px;font-size:22px;display:flex;align-items:center;justify-content:center;gap:4px;color:inherit}
.tbtn span{font-size:14px;font-weight:700}
.tbtn.off{opacity:.55}

main{max-width:1100px;margin:0 auto;padding-block:16px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-size:24px;margin:0;line-height:1.15;text-wrap:balance;display:flex;align-items:center;gap:8px}
h3{font-family:var(--f-display);font-size:19px;margin:0;color:var(--muted);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}
.say{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:44px;height:44px;font-size:20px;flex:none}

.demo{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:15px;display:flex;gap:10px;align-items:center}

/* summary tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{border:0;text-align:left;border-radius:20px;padding:14px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-height:132px;position:relative}
.tile .ic{font-size:40px;line-height:1}
.tile .lbl{font-weight:700;font-size:17px}
.tile .val{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1;word-break:break-word}
.tile .sub{font-size:14px;color:var(--muted)}
.tile.good{background:var(--good-bg)} .tile.good .val{color:var(--good)}
.tile.bad{background:var(--bad-bg)} .tile.bad .val{color:var(--bad)}
.tile.cargo{background:var(--cargo-bg)} .tile.cargo .val{color:var(--cargo)}
.arrow{position:absolute;top:12px;right:12px;font-size:26px}

/* big action buttons */
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:760px){.actions{grid-template-columns:repeat(4,minmax(0,1fr))}}
.act{border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:17px;text-align:center;min-height:118px;justify-content:center}
.act .ic{font-size:44px;line-height:1}
.act.good{border-color:var(--good);color:var(--good)} .act.bad{border-color:var(--bad);color:var(--bad)}
.act.cargo{border-color:var(--cargo);color:var(--cargo)} .act.acc{border-color:var(--accent);color:var(--accent)}
.act:active,.tile:active,.card:active{transform:scale(.98)}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{border:0;width:100%;text-align:left;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;font-size:17px;background:var(--surface);border-left:6px solid var(--warn)}
.alert.bad{border-left-color:var(--bad)} .alert .ic{font-size:30px}
.alert b{display:block}

/* cards & grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.card{border:0;text-align:left;width:100%;background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;min-width:0}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.card .nm{font-weight:700;font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.pic{width:64px;height:64px;border-radius:16px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:38px;flex:none;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.pic.big{width:96px;height:96px;font-size:60px;border-radius:22px}
.pic.sm{width:44px;height:44px;font-size:26px;border-radius:12px}
.bar{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.bar.low i{background:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;background:var(--surface2);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.cargo{background:var(--cargo-bg);color:var(--cargo)}
.amt{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1}
.amt.good{color:var(--good)} .amt.bad{color:var(--bad)}

/* segmented */
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-size:16px;min-height:48px;display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* shipment */
.ship{background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.ship .hd{display:flex;gap:12px;align-items:center}
.flag{font-size:46px;line-height:1}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:relative}
.track::before{content:"";position:absolute;left:10%;right:10%;top:22px;height:4px;background:var(--line);border-radius:4px}
.stg{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;font-size:12px;text-align:center;color:var(--muted);line-height:1.15}
.stg .dot{width:46px;height:46px;border-radius:50%;background:var(--surface2);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;filter:grayscale(1);opacity:.6}
.stg.done .dot{background:var(--good-bg);border-color:var(--good);filter:none;opacity:1}
.stg.now .dot{background:var(--cargo-bg);border-color:var(--cargo);filter:none;opacity:1;transform:scale(1.12)}
.stg.now{color:var(--cargo);font-weight:700}
.btn{border:0;border-radius:16px;min-height:54px;padding:10px 18px;font-weight:700;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);border:2px solid var(--line)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* country strip */
.countries{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.cty{flex:none;background:var(--surface);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;box-shadow:var(--shadow);border:0}
.cty .flag{font-size:40px} .cty small{font-size:13px;color:var(--muted)}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .body{flex:1;min-width:0}
.li .t1{font-weight:700;overflow-wrap:anywhere}
.li .t2{font-size:14px;color:var(--muted)}
.li .ic{font-size:28px;flex:none}
.empty{padding:22px;text-align:center;color:var(--muted)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.nav-in{max-width:700px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 2px;font-size:13px;font-weight:700;color:var(--muted);min-height:64px;justify-content:center}
.nav button .ic{font-size:28px;line-height:1.1}
.nav button.on{color:var(--accent)}
.nav button.on .ic{transform:scale(1.12)}
.nav .plus{position:relative;top:-14px}
.nav .plus .ic{width:66px;height:66px;border-radius:50%;background:var(--cargo);color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 4px 14px rgba(208,106,23,.45);border:4px solid var(--surface)}
.nav .plus{color:var(--cargo)}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(5,20,28,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:94%;overflow-y:auto;border-radius:26px 26px 0 0;
  padding-block:14px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
@media(min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:26px;max-height:90%}}
.sheet-hd{display:flex;align-items:center;gap:10px;position:sticky;top:-14px;background:var(--bg);padding-block:8px;z-index:2}
.sheet-hd h2{flex:1;min-width:0}
.x{border:0;background:var(--surface);border-radius:50%;width:48px;height:48px;font-size:22px;flex:none}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--cargo)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:10px}
.pk{border:3px solid transparent;background:var(--surface);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:700;font-size:16px;box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.pk.on{border-color:var(--cargo);background:var(--cargo-bg)}
.pk .ic{font-size:44px;line-height:1}
.pk small{font-weight:400;color:var(--muted);font-size:13px}
.bigchoice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

/* numpad */
.npd{background:var(--surface);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.screen{font-family:var(--f-display);font-weight:800;font-size:44px;text-align:right;line-height:1.1;padding:6px 10px;border-radius:14px;background:var(--surface2);overflow-wrap:anywhere;min-height:64px}
.screen small{font-size:20px;color:var(--muted);font-weight:500}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{border:0;background:var(--surface2);border-radius:14px;height:60px;font-size:28px;font-weight:700;font-family:var(--f-display)}
.keys button.k-del{color:var(--bad)}
.hint{font-size:16px;color:var(--muted);text-align:center}
.eq{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:var(--surface);border-radius:20px;padding:18px;font-size:20px;font-weight:700;box-shadow:var(--shadow);text-align:center}
.eq .op{font-size:30px;color:var(--muted)}
.eq .col{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:140px;overflow-wrap:anywhere}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:700}
.form input,.form select{font:inherit;font-size:19px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-height:54px}
.iconpick{display:flex;flex-wrap:wrap;gap:8px}
.iconpick button{width:54px;height:54px;font-size:30px;border-radius:14px;border:3px solid transparent;background:var(--surface)}
.iconpick button.on{border-color:var(--cargo);background:var(--cargo-bg)}
textarea{font:inherit;font-size:13px;width:100%;min-height:140px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:10px}

/* chart */
.chart{background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .ln-s{stroke:var(--accent);stroke-width:3;fill:none}
.chart .ln-b{stroke:var(--cargo);stroke-width:3;fill:none;stroke-dasharray:6 4}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt-s{fill:var(--accent)} .chart .pt-b{fill:var(--cargo)}
.legend{display:flex;gap:16px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:16px;font-weight:700;font-size:18px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="top-in">
  <div class="brand"><span class="logo" aria-hidden="true">🚢</span><div style="min-width:0"><b id="appName">Cargo Munim</b><small id="coName"></small></div></div>
  <button class="tbtn" id="voiceBtn" data-act="voice" aria-label="Voice">🔊</button>
  <button class="tbtn" data-act="lang" aria-label="Language"><span id="langLbl">EN</span></button>
  <button class="tbtn" data-act="settings" aria-label="Settings">⚙️</button>
</div></header>

<main id="main"></main>

<nav class="nav"><div class="nav-in" id="nav"></div></nav>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

function load(){ try{ const j = localStorage.getItem(KEY); return j ? JSON.parse(j) : null; }catch(e){ return null; } }

const t = k => (L[S.settings.lang] || L.hi)[k] ?? L.en[k] ?? k;

const qtyFmt = n => (+n).toLocaleString('en-IN');

/* ---------- numbers ---------- */
function balance(pid){ // >0 they owe us, <0 we owe them
  let b = 0;
  for (const x of S.txns) if (x.party === pid){
    if (x.type === 'sale') b += x.amount; else if (x.type === 'payIn') b -= x.amount;
    else if (x.type === 'buy') b -= x.amount; else if (x.type === 'payOut') b += x.amount;
  }
  return b;
}
function totals(){
  let lena = 0, dena = 0;
  for (const p of S.parties){ const b = balance(p.id); if (b > 0) lena += b; else dena -= b; }
  const stockVal = S.items.reduce((s, i) => s + i.stock * i.buy, 0);
  const out = S.ships.filter(s => s.dir === 'out' && s.stage < 4), inn = S.ships.filter(s => s.dir === 'in' && s.stage < 4);
  return {lena, dena, stockVal, out, inn};
}
function alerts(){
  const a = [];
  for (const s of S.ships) if (s.stage < 4 && daysFrom(s.eta) < 0) a.push({cls:'bad', ic:'⏰', t:t('lateShip'), d:`${flag(s.country)} ${esc(party(s.party)?.name)} · ${-daysFrom(s.eta)} ${t('late')}`, act:'open-ship', id:s.id});
  for (const i of S.items) if (i.stock < i.min) a.push({cls:'bad', ic:'⚠️', t:`${t('lowStock')}: ${esc(i.name)}`, d:`${qtyFmt(i.stock)} ${esc(i.unit)} ${t('stockLeft')} · ${t('lowAt')} ${qtyFmt(i.min)}`, act:'open-item', id:i.id});
  for (const s of S.ships) if (s.dir === 'in' && s.stage < 4 && daysFrom(s.eta) >= 0 && daysFrom(s.eta) <= 7) a.push({cls:'', ic:'📥', t:t('arriveSoon'), d:`${flag(s.country)} ${esc(party(s.party)?.name)} · ${daysFrom(s.eta)} ${t('daysLeft')}`, act:'open-ship', id:s.id});
  return a;
}

/* ---------- voice ---------- */
function speak(text){
  if (!S.settings.voice || !('speechSynthesis' in window) || !text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{1F1E6}-\u{1F1FF}]/gu, ' '));
    u.lang = hi() ? 'hi-IN' : 'en-IN'; u.rate = .95;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(hi() ? 'hi' : 'en-in')) || speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith(hi() ? 'hi' : 'en'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

function groupBy(arr, f){ const m = {}; for (const x of arr){ const k = f(x); (m[k] = m[k] || []).push(x); } return m; }
function countryStrip(g, title, dir){
  const ks = Object.keys(g); if (!ks.length) return '';

}
function txnList(list, showParty){
  if (!list.length) return `<div class="list"><div class="empty">${t('noData')}</div></div>`;

    const p = party(x.party), i = item(x.item);

      ${!showParty ? `<button class="btn ghost ${armed === 'del-' + x.id ? 'armed' : ''}" style="min-height:44px;padding:4px 10px;font-size:15px" data-act="del-txn" data-id="${x.id}">${armed === 'del-' + x.id ? t('sure') : '🗑️'}</button>` : ''}

}

function priceChart(i){
  const h = (i.hist || []).slice(-12); if (h.length < 2) return `<div class="chart"><div class="empty">${t('noData')}</div></div>`;
  const W0 = 340, H0 = 170, pl = 48, pr = 14, pt = 12, pb = 26;
  const vals = h.flatMap(x => [x.sell, x.buy]); let mn = Math.min(...vals), mx = Math.max(...vals); const pad = (mx - mn) * .15 || mx * .1 || 1; mn = Math.max(0, mn - pad); mx += pad;
  const X = k => pl + k * (W0 - pl - pr) / (h.length - 1), Y = v => pt + (mx - v) * (H0 - pt - pb) / (mx - mn);
  const ticks = [mn, (mn + mx) / 2, mx];
  const line = key => h.map((x, k) => `${X(k).toFixed(1)},${Y(x[key]).toFixed(1)}`).join(' ');
  const area = `${X(0)},${Y(mn)} ${line('sell')} ${X(h.length - 1)},${Y(mn)}`;
  const last = h[h.length - 1];
  return `<div class="chart"><svg viewBox="0 0 ${W0} ${H0}" role="img" aria-label="${t('priceHist')}">
    ${ticks.map(v => `<line class="grid-l" x1="${pl}" x2="${W0 - pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end">${Math.round(v).toLocaleString('en-IN')}</text>`).join('')}
    <polygon class="ar" points="${area}"/>
    <polyline class="ln-b" points="${line('buy')}"/><polyline class="ln-s" points="${line('sell')}"/>
    ${h.map((x, k) => `<circle class="pt-s" cx="${X(k)}" cy="${Y(x.sell)}" r="${k === h.length - 1 ? 5.5 : 3}"/><circle class="pt-b" cx="${X(k)}" cy="${Y(x.buy)}" r="${k === h.length - 1 ? 5.5 : 3}"/>`).join('')}
    <text class="ax" x="${X(0)}" y="${H0 - 6}" text-anchor="start">${fmtDate(h[0].d)}</text><text class="ax" x="${X(h.length - 1)}" y="${H0 - 6}" text-anchor="end">${fmtDate(last.d)}</text>
  </svg><div class="legend"><span><i style="background:var(--accent)"></i>🏷️ ${t('sell')}</span><span><i style="background:var(--cargo)"></i>🛒 ${t('buyP')}</span></div></div>`;
}

/* --- entry wizard --- */
const STEPS = {sale:['type','party','item','qty','rate','ship','confirm'], buy:['type','party','item','qty','rate','ship','confirm'], payIn:['type','party','amount','confirm'], payOut:['type','party','amount','confirm']};
function startWiz(type, pid){
  W = {type: type || null, party: pid || null, item: null, qty: 0, rate: 0, amount: 0, ship: null, country: null, eta: 15, buf: '', k: 0};
  if (type){ W.k = 1; if (pid) W.k = 2; }
  sheet = {k: 'wiz'}; onStep();
}
const stepName = () => W.type ? STEPS[W.type][W.k] : 'type';
function onStep(){
  const s = stepName(), i = item(W.item);
  if (s === 'qty') W.buf = W.qty ? String(W.qty) : '';
  if (s === 'rate') W.buf = String(W.rate || (i ? (W.type === 'sale' ? i.sell : i.buy) : ''));
  if (s === 'amount'){ const b = balance(W.party); W.buf = W.amount ? String(W.amount) : ((W.type === 'payIn' && b > 0) || (W.type === 'payOut' && b < 0) ? String(Math.round(Math.abs(b))) : ''); }
  if (s === 'ship' && !W.country) W.country = party(W.party)?.country || 'AE';
  const q = {type: t('whatHappened'), party: t('who'), item: t('which'), qty: t('howMuch'), rate: t('rateQ'), amount: t('amountQ'), ship: W.type === 'sale' ? t('shipQ') : t('shipQin'), confirm: t('check')}[s];
  setTimeout(() => speak(q), 80);
}
SH.wiz = () => {
  const s = stepName(), steps = W.type ? STEPS[W.type] : STEPS.sale;
  const title = W.type ? `${TYPE_IC[W.type]} ${t(W.type)}` : t('newE');

    body = `<div class="row">${pic(p, 'sm')}<h3 style="flex:1">${t('amountQ')}</h3></div>${numpad('', S.settings.cur, b ? `${b > 0 ? t('theyOwe') : t('weOwe')}: <b class="num">${money(b)}</b>` : t('settled'))}`;

    body = `<div class="bigchoice">
      <button class="act ${W.ship === true ? 'cargo' : ''}" style="min-height:130px" data-act="w-ship" data-v="1" data-say="${sale ? t('byShip') : t('onWay')}"><span class="ic">🚢</span>${sale ? t('byShip') : t('onWay')}</button>

    canNext = true;
  }
  const navBtns = W.k > 0 ? `<div class="row" style="position:sticky;bottom:-24px;background:var(--bg);padding-block:10px">
    <button class="btn" data-act="w-back" data-say="${t('back')}">${t('back')}</button><span class="sp"></span>

  return `<div class="sheet-hd"><h2>${title}</h2><button class="x" data-act="close" aria-label="close">✕</button></div>
  <div class="steps">${steps.map((_, k) => `<i class="${k <= W.k ? 'on' : ''}"></i>`).join('')}</div>${body}${navBtns}`;
};
function wizNext(){
  const s = stepName();
  if (s === 'qty') W.qty = +W.buf; if (s === 'rate') W.rate = +W.buf; if (s === 'amount') W.amount = +W.buf;
  W.k++; onStep();
}
function nextRef(base){ return Math.max(base + 50, ...S.ships.map(s => +String(s.ref).split('-')[1] || 0).filter(n => n > base && n < base + 1000)) + 1; }
function wizSave(){
  const d = todayISO(), id = uid();
  if (W.type === 'sale' || W.type === 'buy'){
    const i = item(W.item), amount = W.qty * W.rate, x = {id, d, type: W.type, party: W.party, item: W.item, qty: W.qty, rate: W.rate, amount};
    if (W.type === 'sale') i.stock -= W.qty;

      const sh = {id: uid(), dir: W.type === 'sale' ? 'out' : 'in', party: W.party, country: W.country, lines: [{item: W.item, qty: W.qty}], stage: 0, eta: addDays(d, W.eta), ref: (W.type === 'sale' ? 'EX-' : 'IM-') + nextRef(W.type === 'sale' ? 1000 : 2000), stockDone: false, txn: id};
      S.ships.push(sh); x.ship = sh.id;
    } else if (W.type === 'buy') i.stock += W.qty;
    S.txns.push(x);
  } else {

  save(); sheet = null; const tp = W.type; W = null;

}

/* ---------- actions ---------- */
document.addEventListener('click', e => {
  const sEl = e.target.closest('[data-say]'); if (sEl && sEl.dataset.say) speak(sEl.dataset.say);
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'bg' && e.target !== el) return;
  const wasArmed = armed; if (!['del-txn','del-item','del-party','demo','clear'].includes(a)) armed = null;
  const scrollSheet = () => { const s = document.querySelector('.sheet'); if (s) s.scrollTop = 0; };
  switch (a){
    case 'nav': view = el.dataset.v; sheet = null; scrollTo(0, 0); break;
    case 'lang': S.settings.lang = hi() ? 'en' : 'hi'; save(); break;
    case 'voice': S.settings.voice = !S.settings.voice; save(); if (S.settings.voice) setTimeout(() => speak(t('voiceOn')), 50); break;
    case 'settings': sheet = {k: 'settings'}; break;
    case 'close': case 'bg': sheet = null; W = null; break;
    case 'money-tab': view = 'money'; setTimeout(() => document.getElementById(el.dataset.f)?.scrollIntoView({behavior: 'smooth'}), 50); break;
    case 'ship-tab': view = 'ships'; shipDir = el.dataset.d; break;
    case 'pfilter': partyFilter = el.dataset.f; break;
    case 'open-item': sheet = {k: 'item', id}; break;
    case 'open-party': sheet = {k: 'party', id}; break;
    case 'open-ship': sheet = {k: 'ship', id}; break;
    case 'ship-next': {
      const s = S.ships.find(x => x.id === id); if (!s || s.stage >= 4) break;
      s.stage++;
      if (s.stage === 4){ s.eta = s.eta > todayISO() ? todayISO() : s.eta;
        if (s.dir === 'in' && !s.stockDone){ for (const l of s.lines){ const i = item(l.item); if (i) i.stock += l.qty; } s.stockDone = true; toast('🏬 ' + t('stockAdded')); }
      }
      save(); setTimeout(() => speak(t('stages')[s.stage]), 50); break; }
    case 'wiz': startWiz(el.dataset.type, el.dataset.party); break;
    case 'w-type': W.type = el.dataset.v; W.k = 1; onStep(); scrollSheet(); break;
    case 'w-party': W.party = el.dataset.v; W.k++; onStep(); break;
    case 'w-item': W.item = el.dataset.v; W.rate = 0; W.k++; onStep(); break;
    case 'w-ship': W.ship = el.dataset.v === '1'; if (W.ship) setTimeout(() => speak(W.type === 'sale' ? t('toCountry') : t('fromCountry')), 900); break;
    case 'w-country': W.country = el.dataset.v; break;
    case 'w-eta': W.eta = +el.dataset.v; break;
    case 'w-next': if (!el.disabled) wizNext(); break;
    case 'w-back': W.k = Math.max(0, W.k - 1); if (W.k === 0) W.type = null; onStep(); break;
    case 'w-save': wizSave(); break;
    case 'np': { const k = el.dataset.k; if (k === '⌫') W.buf = W.buf.slice(0, -1); else if (W.buf.length < 10) W.buf = (W.buf + k).replace(/^0+(?=\d)/, ''); break; }
    case 'adj': W = {buf: ''}; sheet = {k: 'adj', id, m: el.dataset.m, back: sheet}; break;
    case 'adj-save': {
      const i = item(sheet.id), q = +W.buf; if (!(q > 0)) break;
      i.stock += sheet.m === 'in' ? q : -q;
      S.txns.push({id: uid(), d: todayISO(), type: 'adj', item: i.id, qty: sheet.m === 'in' ? q : -q, amount: 0});
      save(); sheet = sheet.back; W = null; toast('✅ ' + t('saved')); speak(t('done')); break; }
    case 'price': { const i = item(id); W = {buf: String(i.sell)}; sheet = {k: 'price', id, f: 'sell', back: sheet}; break; }
    case 'price-f': { const i = item(sheet.id); sheet.f = el.dataset.f; W.buf = String(sheet.f === 'sell' ? i.sell : i.buy); break; }
    case 'price-save': {
      const i = item(sheet.id), v = +W.buf; if (!(v > 0)) break;
      i[sheet.f] = v; i.hist = i.hist || []; const last = i.hist[i.hist.length - 1];
      if (last && last.d === todayISO()){ last.sell = i.sell; last.buy = i.buy; } else i.hist.push({d: todayISO(), sell: i.sell, buy: i.buy});
      save(); sheet = sheet.back; W = null; toast('✅ ' + t('saved')); speak(t('done')); break; }
    case 'item-form': sheet = {k: 'itemForm', icon: '📦', ret: el.dataset.ret ? sheet : null}; break;
    case 'party-form': sheet = {k: 'partyForm', icon: '🏢', kind: W && (W.type === 'buy' || W.type === 'payOut') ? 'supplier' : 'customer', ret: el.dataset.ret ? sheet : null}; break;
    case 'f-icon': sheet.icon = el.dataset.v; keepForm(); return;
    case 'f-kind': sheet.kind = el.dataset.v; keepForm(); return;
    case 'del-txn': if (wasArmed === 'del-' + id){ deleteTxn(id); armed = null; } else armed = 'del-' + id; break;
    case 'del-item': if (wasArmed === 'del-item'){ S.items = S.items.filter(x => x.id !== id); save(); sheet = null; armed = null; } else armed = 'del-item'; break;
    case 'del-party': if (wasArmed === 'del-party'){ S.parties = S.parties.filter(x => x.id !== id); save(); sheet = null; armed = null; } else armed = 'del-party'; break;
    case 'demo': if (wasArmed === 'demo'){ S = seed(); save(); armed = null; sheet = null; toast('✅ ' + t('restored')); } else armed = 'demo'; break;
    case 'clear': if (wasArmed === 'clear'){ const st = S.settings; S = {settings: {...st, company: ''}, items: [], parties: [], txns: [], ships: [], demo: false}; save(); armed = null; sheet = null; toast('✅ ' + t('done')); } else armed = 'clear'; break;
    case 'dl': {
      try{ const b = new Blob([JSON.stringify(S, null, 1)], {type: 'application/json'}); const u = URL.createObjectURL(b); const l = document.createElement('a'); l.href = u; l.download = `cargo-munim-backup-${todayISO()}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); }catch(err){}
      return; }
    case 'copy': { const ta = document.getElementById('bk'); navigator.clipboard?.writeText(ta.value).then(() => toast(t('copied')), () => { ta.select(); }); if (!navigator.clipboard) ta.select(); return; }
    case 'paste-load': restoreFrom(document.getElementById('pasteIn').value); break;
    default: return;
  }
  render();
});
function keepForm(){ // re-render a form sheet without losing typed text
  const vals = {}; document.querySelectorAll('.sheet input:not([type=file]), .sheet select').forEach(x => vals[x.id] = x.value);
  renderSheet(); for (const k in vals){ const x = document.getElementById(k); if (x) x.value = vals[k]; }
}
function deleteTxn(id){
  const x = S.txns.find(y => y.id === id); if (!x) return;
  const i = item(x.item), sh = x.ship ? S.ships.find(s => s.id === x.ship) : null;
  if (i){
    if (x.type === 'sale') i.stock += x.qty;
    if (x.type === 'buy' && (!sh || sh.stockDone)) i.stock -= x.qty;
    if (x.type === 'adj') i.stock -= x.qty;
  }
  if (sh) S.ships = S.ships.filter(s => s !== sh);
  S.txns = S.txns.filter(y => y !== x); save();
}
function restoreFrom(text){
  try{ const d = JSON.parse(text); if (!d || !Array.isArray(d.items) || !Array.isArray(d.parties) || !Array.isArray(d.txns) || !Array.isArray(d.ships)) throw 0;
    d.settings = Object.assign({lang: 'hi', voice: true, cur: '₹', company: ''}, d.settings || {}); S = d; save(); sheet = null; toast('✅ ' + t('restored')); }
  catch(e){ toast('🚫 ' + t('badFile')); }
}
document.addEventListener('submit', e => {
  e.preventDefault();
  const v = id => document.getElementById(id)?.value?.trim();
  if (e.target.id === 'itemF'){
    const it = {id: uid(), name: v('f_name'), icon: sheet.icon, photo: sheet.photo || null, unit: v('f_unit') || 'pcs', stock: +v('f_stock') || 0, min: +v('f_min') || 0, buy: +v('f_buy') || 0, sell: +v('f_sell') || 0};
    it.hist = [{d: todayISO(), sell: it.sell, buy: it.buy}];
    S.items.push(it); save();
    if (sheet.ret){ sheet = sheet.ret; W.item = it.id; W.k++; onStep(); } else sheet = {k: 'item', id: it.id};
  } else if (e.target.id === 'partyF'){
    const p = {id: uid(), name: v('f_name'), icon: sheet.icon, photo: sheet.photo || null, phone: v('f_phone'), country: v('f_country'), kind: sheet.kind};
    S.parties.push(p); save();
    if (sheet.ret){ sheet = sheet.ret; W.party = p.id; W.k++; onStep(); } else sheet = {k: 'party', id: p.id};
  } else if (e.target.id === 'setF'){
    S.settings.company = v('s_co'); S.settings.cur = v('s_cur'); save(); sheet = null;
  } else return;
  toast('✅ ' + t('saved')); speak(t('done')); render();
});
document.addEventListener('change', e => {
  if (e.target.id === 'photoIn' && e.target.files[0]){
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const c = document.createElement('canvas'), s = 160, k = Math.max(s / img.width, s / img.height); c.width = c.height = s;
      const g = c.getContext('2d'); g.drawImage(img, (s - img.width * k) / 2, (s - img.height * k) / 2, img.width * k, img.height * k);
      sheet.photo = c.toDataURL('image/jpeg', .8); keepForm(); }; img.src = r.result; };
    r.readAsDataURL(e.target.files[0]);
  }
  if (e.target.id === 'restoreIn' && e.target.files[0]){ const r = new FileReader(); r.onload = () => { restoreFrom(r.result); render(); }; r.readAsText(e.target.files[0]); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheet){ sheet = null; W = null; render(); return; }
  const numScreen = W && W.buf !== undefined && sheet && (['adj','price'].includes(sheet.k) || (sheet.k === 'wiz' && ['qty','rate','amount'].includes(stepName())));
  if (numScreen && !/input|textarea|select/i.test(e.target.tagName)){
    if (/^\d$/.test(e.key) && W.buf.length < 10){ W.buf = (W.buf + e.key).replace(/^0+(?=\d)/, ''); renderSheet(); }
    else if (e.key === 'Backspace' && !/input|textarea/i.test(e.target.tagName)){ W.buf = W.buf.slice(0, -1); renderSheet(); }
  }
});

/* ---------- sample data (marked as demo) ---------- */
function seed(){
