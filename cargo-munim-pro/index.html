<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6b78">
<title>Cargo Munim Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mukta:wght@400;600;700&display=swap">
<style>
/* Layout: app shell — sticky header; desktop gets a left sidebar, phone gets a bottom bar with a big + ; content is one column of picture tiles, cards and lists; pop-up sheets for every detail */
:root{
  --bg:#e8eff0; --surface:#ffffff; --surface2:#f2f7f8; --ink:#0f2a3a; --muted:#546b78; --line:#d0dde2;
  --accent:#0a6b78; --accent-ink:#ffffff; --deep:#073f48; --cargo:#cc6614; --cargo-bg:#fcebdb;
  --good:#16794a; --good-bg:#ddf1e4; --bad:#bd3227; --bad-bg:#fae2de; --warn:#946600; --warn-bg:#fbeec9; --info:#2d5fa8; --info-bg:#e1eafa;
  --paper:#ffffff; --paper-ink:#151515; --paper-line:#9a9a9a;
  --shadow:0 1px 2px rgba(15,42,58,.08),0 4px 14px rgba(15,42,58,.06);
  --f-display:"Baloo 2","Mukta",system-ui,sans-serif;
  --f-body:"Mukta","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a161d; --surface:#11232c; --surface2:#0e1d25; --ink:#e3edf1; --muted:#91a7b2; --line:#22404b;
  --accent:#3fb3bf; --accent-ink:#04222a; --deep:#0b2f37; --cargo:#f19a52; --cargo-bg:#3a2410;
  --good:#52c98a; --good-bg:#0f3220; --bad:#ff8074; --bad-bg:#3b1612; --warn:#f0c255; --warn-bg:#352909; --info:#7fb0ff; --info-bg:#132845;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a161d; --surface:#11232c; --surface2:#0e1d25; --ink:#e3edf1; --muted:#91a7b2; --line:#22404b;
  --accent:#3fb3bf; --accent-ink:#04222a; --deep:#0b2f37; --cargo:#f19a52; --cargo-bg:#3a2410;
  --good:#52c98a; --good-bg:#0f3220; --bad:#ff8074; --bad-bg:#3b1612; --warn:#f0c255; --warn-bg:#352909; --info:#7fb0ff; --info-bg:#132845;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.4;margin:0;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--cargo);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--accent)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--accent);color:var(--accent-ink);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .logo{font-size:30px;line-height:1}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:800;display:block;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b em{font-style:normal;font-size:12px;background:var(--cargo);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;letter-spacing:.5px}
.brand small{opacity:.88;font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{background:rgba(255,255,255,.16);border:0;border-radius:14px;min-width:46px;height:46px;padding:0 10px;font-size:21px;display:flex;align-items:center;justify-content:center;gap:4px;color:inherit;flex:none}
.tbtn span{font-size:14px;font-weight:700}
.tbtn.off{opacity:.55}
.tbtn.mic{background:var(--cargo);color:#fff}
@media(max-width:520px){.tbtn.hide-sm{display:none}}

.shell{display:block}
.side{display:none}
main{max-width:1180px;margin:0 auto;padding-block:16px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0}
@media(min-width:1000px){
  .shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100% - 62px);background:linear-gradient(to right,var(--surface) 232px,transparent 232px)}
  .side{display:flex;flex-direction:column;gap:4px;padding:16px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-right:1px solid var(--line);position:sticky;top:calc(62px + env(safe-area-inset-top,0px));height:calc(100vh - 62px);overflow-y:auto}
  .side button{border:0;background:none;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;font-weight:700;font-size:17px;text-align:left;color:var(--muted)}
  .side button .ic{font-size:24px;width:30px;text-align:center}
  .side button.on{background:var(--surface2);color:var(--accent)}
  .side .newbtn{background:var(--cargo);color:#fff;justify-content:center;margin-bottom:10px;min-height:54px}
  .nav{display:none}
  main{padding-bottom:40px;margin:0}
}
h2{font-family:var(--f-display);font-size:25px;margin:0;line-height:1.15;text-wrap:balance;display:flex;align-items:center;gap:8px}
h3{font-family:var(--f-display);font-size:19px;margin:0;color:var(--muted);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}
.say{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:44px;height:44px;font-size:20px;flex:none}
.note{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:15px;display:flex;gap:10px;align-items:center}
.note.info{background:var(--info-bg);color:var(--info)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{border:0;text-align:left;border-radius:20px;padding:14px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-height:128px;position:relative;min-width:0}
.tile .ic{font-size:38px;line-height:1}
.tile .lbl{font-weight:700;font-size:17px}
.tile .val{font-family:var(--f-display);font-weight:800;font-size:25px;line-height:1.1;overflow-wrap:anywhere}
.tile .sub{font-size:14px;color:var(--muted)}
.tile.good{background:var(--good-bg)} .tile.good .val{color:var(--good)}
.tile.bad{background:var(--bad-bg)} .tile.bad .val{color:var(--bad)}
.tile.cargo{background:var(--cargo-bg)} .tile.cargo .val{color:var(--cargo)}
.tile.info{background:var(--info-bg)} .tile.info .val{color:var(--info)}
.arrow{position:absolute;top:12px;right:12px;font-size:24px}

.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:760px){.actions{grid-template-columns:repeat(5,minmax(0,1fr))}}
.act{border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:16px;text-align:center;min-height:112px;justify-content:center;min-width:0}
.act .ic{font-size:42px;line-height:1}
.act small{font-weight:400;color:var(--muted);font-size:13px}
.act.good{border-color:var(--good);color:var(--good)} .act.bad{border-color:var(--bad);color:var(--bad)}
.act.cargo{border-color:var(--cargo);color:var(--cargo)} .act.acc{border-color:var(--accent);color:var(--accent)} .act.info{border-color:var(--info);color:var(--info)}
.act:active,.tile:active,.card:active{transform:scale(.98)}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{border:0;width:100%;text-align:left;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;font-size:17px;background:var(--surface);border-left:6px solid var(--warn);min-width:0}
.alert.bad{border-left-color:var(--bad)} .alert.good{border-left-color:var(--good)} .alert.info{border-left-color:var(--info)}
.alert .ic{font-size:28px;flex:none}
.alert b{display:block}
.alert > span:last-child{min-width:0;overflow-wrap:anywhere}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.card{border:0;text-align:left;width:100%;background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;min-width:0}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.card .nm{font-weight:700;font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.pic{width:64px;height:64px;border-radius:16px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:38px;flex:none;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.pic.big{width:96px;height:96px;font-size:60px;border-radius:22px}
.pic.sm{width:44px;height:44px;font-size:26px;border-radius:12px}
.bar{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.bar.low i{background:var(--bad)} .bar.mid i{background:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.cargo{background:var(--cargo-bg);color:var(--cargo)} .pill.info{background:var(--info-bg);color:var(--info)}
.amt{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1}
.amt.good{color:var(--good)} .amt.bad{color:var(--bad)}

.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:16px;min-height:46px;display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.ship{background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.ship .hd{display:flex;gap:12px;align-items:center}
.flag{font-size:44px;line-height:1}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:relative}
.track::before{content:"";position:absolute;left:10%;right:10%;top:22px;height:4px;background:var(--line);border-radius:4px}
.stg{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;font-size:12px;text-align:center;color:var(--muted);line-height:1.15}
.stg .dot{width:46px;height:46px;border-radius:50%;background:var(--surface2);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;filter:grayscale(1);opacity:.6}
.stg.done .dot{background:var(--good-bg);border-color:var(--good);filter:none;opacity:1}
.stg.now .dot{background:var(--cargo-bg);border-color:var(--cargo);filter:none;opacity:1;transform:scale(1.12)}
.stg.now{color:var(--cargo);font-weight:700}
.docs-mini{display:flex;gap:4px;flex-wrap:wrap}
.docs-mini span{font-size:12px;border-radius:8px;padding:1px 6px;background:var(--surface2);color:var(--muted)}
.docs-mini span.ok{background:var(--good-bg);color:var(--good)}

.btn{border-radius:16px;min-height:52px;padding:8px 16px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);border:2px solid var(--line);text-decoration:none;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.wa{background:#1f9e55;color:#fff;border-color:#1f9e55}
.btn.ghost{background:transparent}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.wide{width:100%}
.btn.sm{min-height:42px;font-size:15px;padding:4px 12px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.countries{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.cty{flex:none;background:var(--surface);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;box-shadow:var(--shadow);border:0}
.cty .flag{font-size:38px} .cty small{font-size:13px;color:var(--muted)}

.list{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);min-width:0;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.li:last-child{border-bottom:0}
.li .body{flex:1;min-width:0}
.li .t1{font-weight:700;overflow-wrap:anywhere}
.li .t2{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.li .ic{font-size:28px;flex:none}
.li .rt{text-align:right;flex:none}
.empty{padding:22px;text-align:center;color:var(--muted)}
.empty-big{background:var(--surface);border-radius:22px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:var(--shadow)}
.empty-big .ic{font-size:64px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.nav-in{max-width:700px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;padding:8px 2px;font-size:13px;font-weight:700;color:var(--muted);min-height:64px;justify-content:center}
.nav button .ic{font-size:27px;line-height:1.1}
.nav button.on{color:var(--accent)}
.nav .plus{position:relative;top:-14px;color:var(--cargo)}
.nav .plus .ic{width:66px;height:66px;border-radius:50%;background:var(--cargo);color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 4px 14px rgba(204,102,20,.45);border:4px solid var(--surface)}

.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(5,20,28,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94%;overflow-y:auto;border-radius:26px 26px 0 0;
  padding-block:14px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sheet.xl{max-width:920px}
@media(min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:26px;max-height:92%}}
.sheet-hd{display:flex;align-items:center;gap:10px;position:sticky;top:-14px;background:var(--bg);padding-block:8px;z-index:2}
.sheet-hd h2{flex:1;min-width:0}
.x{border:0;background:var(--surface);border-radius:50%;width:48px;height:48px;font-size:22px;flex:none}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--cargo)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:10px}
.pick.sm{grid-template-columns:repeat(auto-fill,minmax(min(100%,104px),1fr))}
.pk{border:3px solid transparent;background:var(--surface);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:700;font-size:16px;box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.pk.on{border-color:var(--cargo);background:var(--cargo-bg)}
.pk .ic{font-size:42px;line-height:1}
.pk small{font-weight:400;color:var(--muted);font-size:13px}
.bigchoice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bottom-bar{position:sticky;bottom:-24px;background:var(--bg);padding-block:10px;display:flex;gap:10px;align-items:center}

.npd{background:var(--surface);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.screen{font-family:var(--f-display);font-weight:800;font-size:42px;text-align:right;line-height:1.1;padding:6px 10px;border-radius:14px;background:var(--surface2);overflow-wrap:anywhere;min-height:62px}
.screen small{font-size:19px;color:var(--muted);font-weight:500}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{border:0;background:var(--surface2);border-radius:14px;height:58px;font-size:28px;font-weight:700;font-family:var(--f-display)}
.keys button.k-del{color:var(--bad)}
.hint{font-size:16px;color:var(--muted);text-align:center}
.eq{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:var(--surface);border-radius:20px;padding:18px;font-size:19px;font-weight:700;box-shadow:var(--shadow);text-align:center}
.eq .op{font-size:28px;color:var(--muted)}
.eq .col{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:150px;overflow-wrap:anywhere}

.form{display:flex;flex-direction:column;gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:700;min-width:0}
.form input,.form select,.form textarea{font:inherit;font-size:18px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-height:52px}
.form .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.iconpick{display:flex;flex-wrap:wrap;gap:8px}
.iconpick button{width:52px;height:52px;font-size:28px;border-radius:14px;border:3px solid transparent;background:var(--surface)}
.iconpick button.on{border-color:var(--cargo);background:var(--cargo-bg)}
textarea.code{font:inherit;font-size:13px;width:100%;min-height:120px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:10px}

.chart{background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--shadow);min-width:0}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .ln-s{stroke:var(--accent);stroke-width:3;fill:none}
.chart .ln-b{stroke:var(--cargo);stroke-width:3;fill:none;stroke-dasharray:6 4}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt-s{fill:var(--accent)} .chart .pt-b{fill:var(--cargo)}
.chart .b-s{fill:var(--accent)} .chart .b-b{fill:var(--cargo)} .chart .b-e{fill:var(--muted)}
.chart .lbl{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--f-body)}
.legend{display:flex;gap:16px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin-right:6px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.hb .nm{font-weight:700;overflow-wrap:anywhere;font-size:16px}
.hb .v{font-weight:700;font-size:15px}
.hb .track2{grid-column:1/-1;height:12px;background:var(--surface2);border-radius:9px;overflow:hidden}
.hb .track2 i{display:block;height:100%;background:var(--accent);border-radius:9px}
.hb .track2 i.cargo{background:var(--cargo)} .hb .track2 i.bad{background:var(--bad)} .hb .track2 i.warn{background:var(--warn)} .hb .track2 i.good{background:var(--good)}
.panel{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}

.route{background:var(--surface);border-radius:18px;padding:10px;box-shadow:var(--shadow)}
.route svg{width:100%;height:auto;display:block}
.route .sea{fill:var(--info-bg)} .route .path{stroke:var(--info);stroke-width:2.5;fill:none;stroke-dasharray:6 6}
.route .done{stroke:var(--cargo);stroke-width:4;fill:none}
.route .port{fill:var(--ink)} .route .pl{fill:var(--ink);font-size:13px;font-weight:700;font-family:var(--f-body)}
.route .ps{fill:var(--muted);font-size:11px;font-family:var(--f-body)}

.docchk{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.docchk button{border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:10px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;text-align:left;min-width:0}
.docchk button .ic{font-size:26px;flex:none}
.docchk button.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}

.paper{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:24px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.45;overflow-x:auto;box-shadow:var(--shadow)}
.paper table{width:100%;border-collapse:collapse;min-width:560px}
.paper th,.paper td{border:1px solid var(--paper-line);padding:6px 8px;text-align:left;vertical-align:top}
.paper th{background:#eef0f1}
.paper .r{text-align:right}
.paper h1{font-size:20px;text-align:center;letter-spacing:2px;margin:0 0 12px}
.paper .meta{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--paper-line);margin-bottom:10px;min-width:560px}
.paper .meta > div{padding:8px;border:1px solid var(--paper-line)}

.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:10px 14px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.micbig{width:120px;height:120px;border-radius:50%;border:0;background:var(--cargo);color:#fff;font-size:56px;align-self:center;box-shadow:0 6px 20px rgba(204,102,20,.4)}
.micbig.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(204,102,20,.55)}70%{box-shadow:0 0 0 22px rgba(204,102,20,0)}100%{box-shadow:0 0 0 0 rgba(204,102,20,0)}}
.heard{font-size:22px;font-weight:700;text-align:center;min-height:34px}

.lock{position:fixed;inset:0;z-index:80;background:var(--deep);color:#fff;display:flex;align-items:center;justify-content:center;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.lock-in{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.lock .roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.lock .roles button{border:3px solid transparent;background:rgba(255,255,255,.1);border-radius:18px;padding:14px 4px;color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.lock .roles button.on{border-color:var(--cargo)}
.lock .roles .ic{font-size:44px}
.lock .dots{display:flex;gap:14px}
.lock .dots i{width:20px;height:20px;border-radius:50%;border:3px solid #fff}
.lock .dots i.f{background:#fff}
.lock .keys{width:100%}
.lock .keys button{background:rgba(255,255,255,.12);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:16px;font-weight:700;font-size:17px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<body>

<header class="top"><div class="top-in">
  <div class="brand"><span class="logo" aria-hidden="true">🚢</span><div style="min-width:0"><b><span id="appName">Cargo Munim</span><em>PRO</em></b><small id="coName"></small></div></div>
  <button class="tbtn mic" id="micBtn" data-act="voice-entry" aria-label="Speak" hidden>🎤</button>
  <button class="tbtn hide-sm" data-act="search" aria-label="Search">🔍</button>
  <button class="tbtn" id="voiceBtn" data-act="voice" aria-label="Voice">🔊</button>
  <button class="tbtn" data-act="lang" aria-label="Language"><span id="langLbl">EN</span></button>
  <button class="tbtn" id="roleBtn" data-act="lock" aria-label="Role">👑</button>
</div></header>
<div class="shell"><aside class="side" id="side"></aside><main id="main"></main></div>
<nav class="nav"><div class="nav-in" id="nav"></div></nav>
<div id="sheetRoot"></div>
<div id="lockRoot"></div>
<div id="toastRoot"></div>

<script>
/* ================= Cargo Munim PRO =================
   Import / export ERP for people who may not read: pictures, colours, voice.
   Storage: in a claude.ai artifact with the `db` capability the whole team shares one live database;
   anywhere else (file opened on a desktop) data stays in this browser's localStorage. */
'use strict';
const DAY = 864e5;
const pad2 = n => String(n).padStart(2, '0');
const isoOf = dt => `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())}`;
const today = () => isoOf(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoOf(d); };
const daysFrom = iso => Math.round((new Date(iso + 'T12:00:00') - new Date(today() + 'T12:00:00')) / DAY);
const nowISO = () => new Date().toISOString();
const uid = () => Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const flag = cc => cc && /^[A-Z]{2}$/.test(cc) ? String.fromCodePoint(...[...cc].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : '🏳️';
const groupBy = (arr, f) => { const m = {}; for (const x of arr){ const k = f(x); (m[k] = m[k] || []).push(x); } return m; };
const sum = (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- per-viewer prefs (language, voice, role) ---------- */
const PKEY = 'cm_pro_prefs', DKEY = 'cm_pro_data_v2';
let P = {lang: 'hi', voice: true, role: null};
try{ Object.assign(P, JSON.parse(localStorage.getItem(PKEY) || '{}')); }catch(e){}
const savePrefs = () => { try{ localStorage.setItem(PKEY, JSON.stringify(P)); }catch(e){} };
const T = (h, e) => P.lang === 'hi' ? h : e;
const hi = () => P.lang === 'hi';

/* ---------- reference data ---------- */
const COUNTRIES = [
 ['IN','भारत','India','Nhava Sheva'],['AE','दुबई (UAE)','UAE','Jebel Ali'],['SA','सऊदी अरब','Saudi Arabia','Jeddah'],['OM','ओमान','Oman','Sohar'],['QA','क़तर','Qatar','Hamad'],['KW','कुवैत','Kuwait','Shuwaikh'],
 ['US','अमेरिका','USA','New York'],['GB','इंग्लैंड','UK','Felixstowe'],['DE','जर्मनी','Germany','Hamburg'],['NL','नीदरलैंड','Netherlands','Rotterdam'],['FR','फ़्रांस','France','Le Havre'],['IT','इटली','Italy','Genoa'],
 ['CN','चीन','China','Shanghai'],['BD','बांग्लादेश','Bangladesh','Chittagong'],['NP','नेपाल','Nepal','Birgunj ICD'],['LK','श्रीलंका','Sri Lanka','Colombo'],['VN','वियतनाम','Vietnam','Ho Chi Minh'],['SG','सिंगापुर','Singapore','Singapore'],
 ['MY','मलेशिया','Malaysia','Port Klang'],['ID','इंडोनेशिया','Indonesia','Jakarta'],['TH','थाईलैंड','Thailand','Laem Chabang'],['JP','जापान','Japan','Yokohama'],['KR','कोरिया','Korea','Busan'],['AU','ऑस्ट्रेलिया','Australia','Sydney'],
 ['CA','कनाडा','Canada','Vancouver'],['RU','रूस','Russia','St Petersburg'],['TR','तुर्की','Turkey','Mersin'],['EG','मिस्र','Egypt','Port Said'],['ZA','दक्षिण अफ़्रीका','South Africa','Durban'],['KE','केन्या','Kenya','Mombasa'],['IR','ईरान','Iran','Bandar Abbas']
];
const CUR = {INR: '₹', USD: '$', AED: 'AED ', EUR: '€', GBP: '£', SAR: 'SAR '};
const CUR_HI = {INR: 'रुपये', USD: 'डॉलर', AED: 'दिरहम', EUR: 'यूरो', GBP: 'पाउंड', SAR: 'रियाल'};
const ITEM_ICONS = ['📦','🍚','🌾','🌶️','🫚','☕','🍵','🥜','🌰','🧂','🍯','🥭','🍌','🥥','🧅','🧄','🍅','🐟','🧵','👕','👟','👜','🪵','🧱','⚙️','🔩','🛢️','🧴','💊','💎','🪨','🔌','🚗','🧸','🪑'];
const PARTY_ICONS = ['🏢','🏭','🏪','🚚','👨‍💼','👩‍💼','🧔','👳','🧕','👴','🧑‍🌾','⚓','🌰','🏦'];
const STAGE_IC = ['📦','⚓','🚢','🛃','✅'];
const STAGES = () => [T('पैकिंग','Packing'), T('बंदरगाह','Port'), T('समुंदर में','At sea'), T('कस्टम','Customs'), T('पहुँच गया','Delivered')];
const TYPE_IC = {sale:'📤', buy:'📥', payIn:'💰', payOut:'💸', adj:'🔢', exp:'🧾'};
const TYPE_NM = k => ({sale:T('माल दिया','Gave goods'), buy:T('माल लिया','Got goods'), payIn:T('पैसा मिला','Money received'), payOut:T('पैसा दिया','Money paid'), adj:T('गिनती बदली','Stock count'), exp:T('खर्चा','Expense')}[k]);
const TYPE_SUB = k => ({sale:T('बेचा / भेजा','Sold / sent'), buy:T('खरीदा / मँगाया','Bought / ordered'), payIn:T('किसी ने पैसा दिया','Someone paid us'), payOut:T('हमने पैसा दिया','We paid someone'), exp:T('भाड़ा, कस्टम…','Freight, duty…')}[k]);
const EXP = {freight:['🚢','भाड़ा (Freight)','Freight'], duty:['🛃','कस्टम ड्यूटी','Customs duty'], cha:['🧾','एजेंट (CHA)','Agent (CHA)'], insurance:['🛡️','बीमा','Insurance'], transport:['🚚','ट्रक / ढुलाई','Transport'], packing:['📦','पैकिंग','Packing'], bank:['🏦','बैंक चार्ज','Bank charges'], other:['➕','दूसरा','Other']};
const expNm = k => EXP[k] ? (hi() ? EXP[k][1] : EXP[k][2]) : k;
const DOCS = [['inv','🧾','Invoice'],['pl','📋','Packing List'],['sb','📑','Shipping Bill / BOE'],['bl','🚢','Bill of Lading'],['coo','🌍','Certificate of Origin'],['phyto','🌿','Phyto / Health'],['ins','🛡️','Insurance'],['lc','🏦','LC / Bank docs']];
const ROLES = {owner:['👑','मालिक','Owner'], munim:['🧮','मुनीम','Accountant'], worker:['👷','कारीगर','Worker']};
const roleNm = r => ROLES[r] ? (hi() ? ROLES[r][1] : ROLES[r][2]) : r;
const MODES = {bank:['🏦','बैंक','Bank'], cash:['💵','नकद','Cash'], lc:['📜','LC','LC'], upi:['📱','UPI','UPI']};
const cname = cc => { const c = COUNTRIES.find(x => x[0] === cc); return c ? (hi() ? c[1] : c[2]) : (cc || ''); };
const cport = cc => (COUNTRIES.find(x => x[0] === cc) || [])[3] || '';

/* ---------- data ---------- */
const COLLS = ['items','parties','txns','ships','expenses','log'];
const defaultSettings = () => ({company:'', address:'', iec:'', gstin:'', bank:'', fx:{USD:83.4, AED:22.7, EUR:90.1, GBP:105.2, SAR:22.2}, rodtep:2, drawback:1.5, pins:{owner:'', munim:'', worker:''}, invPrefix:'INV', demo:false});
const blank = () => ({settings: defaultSettings(), items:[], parties:[], txns:[], ships:[], expenses:[], log:[]});
let S = blank();
let mode = 'local', db = null, userCap = null, me = null, dl = null, sampleCap = null, dictCap = null, ttsCap = null;
let loading = false, loadFail = false;

function loadLocal(){ try{ const j = localStorage.getItem(DKEY); if (!j) return null; const d = JSON.parse(j); for (const c of COLLS) d[c] = d[c] || []; d.settings = Object.assign(defaultSettings(), d.settings || {}); return d; }catch(e){ return null; } }
function saveLocal(){ if (mode !== 'local') return; try{ localStorage.setItem(DKEY, JSON.stringify(S)); }catch(e){ toast('⚠️ ' + T('जगह भर गई, बैकअप लो','Storage full, take a backup')); } }
const plain = o => JSON.parse(JSON.stringify(o));
function put(c, o){
  o.at = o.at || nowISO(); if (!o.by) o.by = me?.id || P.role || 'owner'; if (!o.role) o.role = P.role || 'owner';
  const arr = S[c], k = arr.findIndex(x => x.id === o.id); if (k >= 0) arr[k] = o; else arr.push(o);
  if (mode === 'cloud') db.collection(c).doc(o.id).set(plain(o)).catch(e => toast('⚠️ ' + T('सेव नहीं हुआ','Not saved') + ' (' + (e?.code || 'error') + ')'));
  else saveLocal();
}
function remove(c, id){
  S[c] = S[c].filter(x => x.id !== id);
  if (mode === 'cloud') db.collection(c).doc(id).delete().catch(e => toast('⚠️ ' + (e?.code || 'error'))); else saveLocal();
}
function putSettings(){
  if (mode === 'cloud') db.doc('config/settings').set(plain(S.settings)).catch(e => toast('⚠️ ' + (e?.code || 'error'))); else saveLocal();
}
function logIt(ic, text){ put('log', {id: uid(), at: nowISO(), ic, text}); }

/* ---------- derived numbers (recomputed every render) ---------- */
let C = {};
const item = id => S.items.find(x => x.id === id);
const party = id => S.parties.find(x => x.id === id);
const ship = id => S.ships.find(x => x.id === id);
const fxOf = cur => cur === 'INR' || !cur ? 1 : (+S.settings.fx[cur] || 1);
function compute(){
  const stock = {}, sold60 = {}, incoming = {}, cut = addDays(today(), -60);
  for (const i of S.items){ stock[i.id] = +i.open || 0; sold60[i.id] = 0; incoming[i.id] = 0; }
  const shipBy = Object.fromEntries(S.ships.map(s => [s.id, s]));
  for (const x of S.txns){
    if (x.type === 'adj'){ if (x.item in stock) stock[x.item] += +x.qty || 0; continue; }
    if (x.type !== 'sale' && x.type !== 'buy') continue;
    const sh = x.ship ? shipBy[x.ship] : null;
    for (const l of x.lines || []){ if (!(l.item in stock)) continue;
      if (x.type === 'sale'){ stock[l.item] -= l.qty; if (x.d >= cut) sold60[l.item] += l.qty; }
      else if (!sh || sh.stage >= 4) stock[l.item] += l.qty; else incoming[l.item] += l.qty;
    }
  }
  const bal = {}, inv = {}, pOver = {};
  for (const p of S.parties){ bal[p.id] = 0; pOver[p.id] = 0; }
  const byP = groupBy(S.txns.filter(x => x.party), x => x.party);
  const alloc = (bills, paid) => { let rem = paid; for (const b of bills.sort((a, c) => a.d.localeCompare(c.d))){ const p = Math.min(b.amount, Math.max(0, rem)); rem -= p; const open = b.amount - p;
      inv[b.id] = {paid: p, open, status: open <= .5 ? 'paid' : p > .5 ? 'part' : 'unpaid', over: open > .5 && b.due && b.due < today() ? -daysFrom(b.due) : 0}; } };
  for (const [pid, xs] of Object.entries(byP)){
    let b = 0; for (const x of xs){ if (x.type === 'sale' || x.type === 'payOut') b += x.amount; else if (x.type === 'buy' || x.type === 'payIn') b -= x.amount; }
    bal[pid] = Math.abs(b) < 1 ? 0 : b;
    alloc(xs.filter(x => x.type === 'sale'), sum(xs.filter(x => x.type === 'payIn'), x => x.amount));
    alloc(xs.filter(x => x.type === 'buy'), sum(xs.filter(x => x.type === 'payOut'), x => x.amount));
    pOver[pid] = sum(xs.filter(x => x.type === 'sale' && inv[x.id]?.over > 0), x => inv[x.id].open);
  }
  const days = {}; for (const i of S.items){ const avg = sold60[i.id] / 60; days[i.id] = avg > 0 ? Math.max(0, Math.floor(stock[i.id] / avg)) : Infinity; }
  C = {stock, sold60, incoming, bal, inv, pOver, days};
}
const stockOf = id => C.stock[id] ?? 0;
const lineCost = l => (+l.cost || 0) * l.qty;
const expOfShip = sid => sum(S.expenses.filter(e => e.ship === sid), e => e.amount);

/* ---------- formatting ---------- */
const smoney = n => (n < -0.5 ? '− ' : '') + money(n);
const money = n => '₹ ' + Math.round(Math.abs(n)).toLocaleString('en-IN');
const fmoney = (n, cur) => (CUR[cur] || '₹ ') + (cur === 'INR' ? Math.round(Math.abs(n)).toLocaleString('en-IN') : Math.abs(n).toLocaleString('en-US', {maximumFractionDigits: 2}));
const qtyFmt = n => (+n).toLocaleString('en-IN', {maximumFractionDigits: 2});
const fmtDate = iso => iso ? new Date(iso.length > 10 ? iso : iso + 'T12:00:00').toLocaleDateString(hi() ? 'hi-IN' : 'en-IN', {day: 'numeric', month: 'short'}) : '';
const fmtDT = iso => new Date(iso).toLocaleString(hi() ? 'hi-IN' : 'en-IN', {day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'});
const sayMoney = (n, cur) => `${Math.round(Math.abs(n))} ${hi() ? (CUR_HI[cur || 'INR']) : (cur && cur !== 'INR' ? cur : 'rupees')}`;
const pic = (o, cls = '') => `<span class="pic ${cls}">${o && o.photo ? `<img src="${esc(o.photo)}" alt="">` : esc(o ? o.icon : '❓')}</span>`;
const seeMoney = () => (P.role || 'owner') !== 'worker';
const isOwner = () => (P.role || 'owner') === 'owner';
const daysTxt = d => d === Infinity ? T('बिक्री नहीं','no sales') : `~${d} ${T('दिन का माल','days of stock')}`;

/* ---------- voice out ---------- */
function speak(text){
  if (!P.voice || !text) return;
  text = String(text).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}\u{1F1E6}-\u{1F1FF}]/gu, ' ').replace(/₹/g, '').trim();
  if (!text) return;
  const want = hi() ? 'hi' : 'en';
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const v = vs.find(v => (v.lang || '').toLowerCase().startsWith(want === 'hi' ? 'hi' : 'en-in')) || (want === 'en' ? vs.find(v => (v.lang || '').startsWith('en')) : null);
  if (!v && ttsCap){ ttsCap.speak(text.slice(0, 1900), {language: want}).catch(() => {}); return; }
  if (!window.speechSynthesis) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = want === 'hi' ? 'hi-IN' : 'en-IN'; u.rate = .95; if (v) u.voice = v; speechSynthesis.speak(u); }catch(e){}
}

/* ================= VIEWS ================= */
let view = 'home', shipDir = 'out', partyFilter = 'all', invFilter = 'open', invKind = 'sale', sheet = null, W = null, armed = null, lockState = null;
const V = {};

V.home = () => {
  if (loading) return `<div class="empty-big"><span class="ic spin">⚓</span><b>${T('डेटा आ रहा है…','Loading data…')}</b></div>`;
  const out = S.ships.filter(s => s.dir === 'out' && s.stage < 4), inn = S.ships.filter(s => s.dir === 'in' && s.stage < 4);
  if (!S.items.length && !S.parties.length) return emptyStart();
  let lena = 0, dena = 0; for (const p of S.parties){ const b = C.bal[p.id]; if (b > 0) lena += b; else dena -= b; }
  const overdue = sum(Object.values(C.pOver));
  const stockVal = sum(S.items, i => Math.max(0, stockOf(i.id)) * (+i.buy || 0));
  const m0 = today().slice(0, 7);
  const salesM = sum(S.txns.filter(x => x.type === 'sale' && x.d.startsWith(m0)), x => x.amount);
  const A = alerts();
  const said = `${T('लेना है','To receive')} ${sayMoney(lena)}. ${T('देना है','To pay')} ${sayMoney(dena)}. ${out.length} ${T('शिपमेंट जा रहे हैं','shipments going')}, ${inn.length} ${T('आ रहे हैं','coming')}. ${A.length} ${T('बातों पर ध्यान दो','things need attention')}.`;
  return `
  ${S.settings.demo ? `<div class="note" data-say="${esc(T('यह नमूना डेटा है','This is sample data'))}"><span style="font-size:24px">🧪</span><span>${T('यह नमूना (demo) डेटा है। अपना काम शुरू करने के लिए ⚙️ सेटिंग में "सब मिटाओ" दबाएँ।','This is sample (demo) data. To start your own work, press "Erase all" in ⚙️ Settings.')}</span></div>` : ''}
  <div class="row"><h2>${T('आज का हाल','Today at a glance')}</h2><span class="sp"></span>${sampleCap ? `<button class="btn sm" data-act="ai" data-say="${T('मुनीम जी से पूछो','Ask Munim')}">🤖 ${T('मुनीम जी से पूछो','Ask Munim')}</button>` : ''}<button class="say" data-say="${esc(said)}" aria-label="listen">🔊</button></div>
  <div class="tiles">
    ${seeMoney() ? `

function routeSVG(s){
  const W0 = 520, H0 = 150, x1 = 50, x2 = 470, y = 105, cx = 260, cy = 10;
  const from = s.dir === 'out' ? (s.pol || 'Nhava Sheva') : (s.pol || cport(s.country)), to = s.dir === 'out' ? (s.pod || cport(s.country)) : (s.pod || 'Nhava Sheva');
  const fromC = s.dir === 'out' ? 'IN' : s.country, toC = s.dir === 'out' ? s.country : 'IN';
  const created = s.created || addDays(s.eta, -20), total = Math.max(1, (new Date(s.eta) - new Date(created)) / DAY), el = (new Date(today()) - new Date(created)) / DAY;
  const tByStage = [0.04, 0.15, 0.6, 0.92, 1][s.stage];
  const tt = s.stage === 4 ? 1 : s.stage === 2 ? clamp(el / total, 0.2, 0.88) : tByStage;
  const q = t => [(1 - t) ** 2 * x1 + 2 * (1 - t) * t * cx + t * t * x2, (1 - t) ** 2 * y + 2 * (1 - t) * t * cy + t * t * y];
  const [sx, sy] = q(tt), pts = []; for (let k = 0; k <= 30; k++){ const t = k / 30 * tt; pts.push(q(t).map(v => v.toFixed(1)).join(',')); }
  return `<div class="route"><svg viewBox="0 0 ${W0} ${H0}" role="img" aria-label="route">
    <rect class="sea" x="0" y="0" width="${W0}" height="${H0}" rx="12"/>

function aging(type){
  const b = {notdue: 0, d30: 0, d60: 0, d90: 0, late: 0};
  for (const x of S.txns) if (x.type === type){ const s = C.inv[x.id]; if (!s || s.open <= .5) continue; const o = s.over;
    if (!o) b.notdue += s.open; else { b.late += s.open; if (o <= 30) b.d30 += s.open; else if (o <= 60) b.d60 += s.open; else b.d90 += s.open; } }
  return b;
}

}

function monthChart(rows){

  const gw = (W0 - pl - pr) / rows.length, bw = Math.min(22, gw / 4.2), Y = v => pt + (1 - v / mx) * (H0 - pt - pb);
  const tick = [0, mx / 2, mx].map(v => `<line class="grid-l" x1="${pl}" x2="${W0 - pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end">${v >= 1e5 ? (v / 1e5).toFixed(1) + 'L' : Math.round(v / 1000) + 'k'}</text>`).join('');
  const bars = rows.map((r, k) => { const x0 = pl + k * gw + (gw - bw * 3 - 4) / 2; const mo = new Date(r.m + '-15').toLocaleDateString(hi() ? 'hi-IN' : 'en-IN', {month: 'short'});
    return [['rev', 'b-s'], ['buy', 'b-b'], ['exp', 'b-e']].map(([f, c], j) => `<rect class="${c}" x="${x0 + j * (bw + 2)}" y="${Y(r[f])}" width="${bw}" height="${Math.max(0, H0 - pb - Y(r[f]))}" rx="3"><title>${money(r[f])}</title></rect>`).join('') +
      `<text class="ax" x="${pl + k * gw + gw / 2}" y="${H0 - 18}" text-anchor="middle">${mo}</text><text class="lbl" x="${pl + k * gw + gw / 2}" y="${H0 - 4}" text-anchor="middle" style="fill:var(--${r.profit >= 0 ? 'good' : 'bad'})">${r.profit >= 0 ? '+' : '−'}${Math.abs(r.profit) >= 1e5 ? (Math.abs(r.profit) / 1e5).toFixed(1) + 'L' : Math.round(Math.abs(r.profit) / 1000) + 'k'}</text>`; }).join('');
  return `<div class="chart" style="box-shadow:none;padding:0"><svg viewBox="0 0 ${W0} ${H0}" role="img" aria-label="monthly chart">${tick}${bars}</svg>

function priceChart(i){
  const h = (i.hist || []).slice(-12); if (h.length < 2) return `<div class="chart"><div class="empty">${T('भाव अभी एक बार ही डाला है','Only one price so far')}</div></div>`;
  const W0 = 340, H0 = 170, pl = 48, pr = 14, pt = 12, pb = 26;
  const vals = h.flatMap(x => [x.sell, x.buy]); let mn = Math.min(...vals), mx = Math.max(...vals); const pd = (mx - mn) * .15 || mx * .1 || 1; mn = Math.max(0, mn - pd); mx += pd;
  const X = k => pl + k * (W0 - pl - pr) / (h.length - 1), Y = v => pt + (mx - v) * (H0 - pt - pb) / (mx - mn);
  const line = key => h.map((x, k) => `${X(k).toFixed(1)},${Y(x[key]).toFixed(1)}`).join(' ');
  return `<div class="chart"><svg viewBox="0 0 ${W0} ${H0}" role="img" aria-label="price chart">
    ${[mn, (mn + mx) / 2, mx].map(v => `<line class="grid-l" x1="${pl}" x2="${W0 - pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end">${Math.round(v).toLocaleString('en-IN')}</text>`).join('')}
    <polygon class="ar" points="${X(0)},${Y(mn)} ${line('sell')} ${X(h.length - 1)},${Y(mn)}"/><polyline class="ln-b" points="${line('buy')}"/><polyline class="ln-s" points="${line('sell')}"/>
    ${h.map((x, k) => `<circle class="pt-s" cx="${X(k)}" cy="${Y(x.sell)}" r="${k === h.length - 1 ? 5.5 : 3}"/><circle class="pt-b" cx="${X(k)}" cy="${Y(x.buy)}" r="${k === h.length - 1 ? 5.5 : 3}"/>`).join('')}
    <text class="ax" x="${X(0)}" y="${H0 - 6}">${fmtDate(h[0].d)}</text><text class="ax" x="${X(h.length - 1)}" y="${H0 - 6}" text-anchor="end">${fmtDate(h[h.length - 1].d)}</text>
  </svg><div class="legend"><span><i style="background:var(--accent);height:4px"></i>🏷️ ${T('बेचने का','Sell')}</span><span><i style="background:var(--cargo);height:4px"></i>🛒 ${T('खरीद का','Buy')}</span></div></div>`;
}

function docHTML(x, kind){

  const total = sum(rows, r => r.amt), f = n => (CUR[cur] || '') + (+n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const title = kind === 'pl' ? 'PACKING LIST' : kind === 'pro' ? 'PROFORMA INVOICE' : x.type === 'buy' ? 'PURCHASE BILL' : 'COMMERCIAL INVOICE';
  const seller = x.type === 'buy' ? {name: p.name, addr: cname(p.country)} : {name: st.company || 'Your Company', addr: st.address || ''};
  const buyer = x.type === 'buy' ? {name: st.company || 'Your Company', addr: st.address || ''} : {name: p.name, addr: [cname(p.country), p.phone].filter(Boolean).join(' · ')};
  const table = kind === 'pl'

  const bar = W.k > 0 ? `<div class="bottom-bar"><button class="btn" data-act="w-back" data-say="${T('पीछे','Back')}">⬅️ ${T('पीछे','Back')}</button><span class="sp"></span>
    ${hideNext ? '' : s === 'confirm' ? `<button class="btn good" style="flex:1;min-height:62px;font-size:21px" data-act="w-save" data-say="${T('पक्का करो','Confirm')}">✅ ${T('पक्का करो','Confirm')}</button>` : `<button class="btn pri" style="flex:1" data-act="w-next" ${canNext ? '' : 'disabled'} data-say="${T('आगे','Next')}">${T('आगे','Next')} ➡️</button>`}</div>` : '';
  return `<div class="sheet-hd"><h2>${title}</h2><button class="x" data-act="close" aria-label="close">✕</button></div>
  <div class="steps">${steps.map((_, k) => `<i class="${k <= W.k ? 'on' : ''}"></i>`).join('')}</div>${body}${bar}`;
};
function confirmBody(){
  const p = party(W.party), goods = W.type === 'sale' || W.type === 'buy';
  if (W.type === 'exp'){
    const sh = W.shipLink ? ship(W.shipLink) : null, said = `${expNm(W.expcat)}. ${sayMoney(W.amount)}. ${sh ? sh.ref : ''}`; setTimeout(() => speak(said), 600);
    return `<div class="eq" data-say="${esc(said)}"><span class="col"><span style="font-size:48px">${EXP[W.expcat][0]}</span>${esc(expNm(W.expcat))}</span>${sh ? `<span class="op">➡️</span><span class="col"><span style="font-size:44px">${flag(sh.country)}</span>${esc(sh.ref)}</span>` : ''}</div>
    <div class="tile bad" style="min-height:0;align-items:center;text-align:center"><span class="lbl">${T('कुल','Total')}</span><span class="val num" style="font-size:38px">${money(W.amount)}</span></div>
    <form class="form"><label>${T('नोट (ज़रूरी नहीं)','Note (optional)')}<input id="w_note" value="${esc(W.note || '')}"></label></form>`;
  }
  const total = goods ? sum(W.lines, l => l.qty * l.rate) : W.amount, ftotal = goods ? sum(W.lines, l => l.qty * l.frate) : W.famount;
  const said = `${TYPE_NM(W.type)}. ${p.name}. ${goods ? W.lines.map(l => `${item(l.item)?.name} ${l.qty} ${item(l.item)?.unit}`).join(', ') + '. ' : ''}${T('कुल','Total')} ${sayMoney(ftotal, W.cur)}. ${W.ship ? cname(W.country) + ', ' + W.eta + ' ' + T('दिन','days') : ''}`;
  setTimeout(() => speak(said), 600);
  const arrow = W.type === 'sale' || W.type === 'payOut' ? '➡️' : '⬅️';
  return `<div class="eq" data-say="${esc(said)}"><span class="col"><span style="font-size:44px">🏠</span>${T('हम','Us')}</span><span class="op">${arrow}</span>
    ${goods ? W.lines.map(l => { const i = item(l.item); return `<span class="col">${pic(i)}<span class="num">${qtyFmt(l.qty)} ${esc(i.unit)}</span></span>`; }).join('') : `<span class="col"><span style="font-size:44px">${TYPE_IC[W.type]}</span>${MODES[W.mode][0]} ${hi() ? MODES[W.mode][1] : MODES[W.mode][2]}</span>`}<span class="op">${arrow}</span>
    <span class="col">${pic(p)}${esc(p.name)}</span></div>
  <div class="tile ${W.type === 'sale' || W.type === 'payOut' ? 'good' : 'bad'}" style="min-height:0;align-items:center;text-align:center"><span class="lbl">${T('कुल','Total')}</span><span class="val num" style="font-size:36px">${fmoney(ftotal, W.cur)}</span>${W.cur !== 'INR' ? `<span class="sub num">= ${money(total)} @ ${fxOf(W.cur)}</span>` : ''}</div>
  ${goods ? `<div class="row" style="gap:6px;justify-content:center"><span class="pill">⏳ ${W.terms ? W.terms + ' ' + T('दिन में पैसा','days to pay') : T('एडवांस','Advance')}</span>${W.type === 'sale' ? `<span class="pill">📜 ${W.incoterm}</span>` : ''}</div>` : ''}
  ${W.ship ? `<div class="alert"><span class="ic">${flag(W.country)}</span><span><b>🚢 ${esc(cname(W.country))}</b><span class="muted">📅 ${W.eta} ${T('दिन','days')} · ${fmtDate(addDays(today(), W.eta))}</span></span></div>` : ''}`;
}
function wizNext(){
  const s = stepName();
  if (s === 'qty') W.qty = +W.buf;
  if (s === 'rate'){ const fr = +W.buf, i = item(W.item); W.lines.push({item: W.item, qty: W.qty, frate: fr, rate: +(fr * fxOf(W.cur)).toFixed(4), cost: +i.buy || 0}); W.item = null; W.qty = 0; }
  if (s === 'amount'){ if (W.type === 'exp') W.amount = +W.buf; else { W.famount = +W.buf; W.amount = +(W.famount * fxOf(W.cur)).toFixed(2); } }
  W.k++; onStep();
}
function nextNo(prefix, list, field){ const y = today().slice(0, 4), re = new RegExp('^' + prefix + '-' + y + '-(\\d+)$'); let mx = 0; for (const x of list){ const m = re.exec(x[field] || ''); if (m) mx = Math.max(mx, +m[1]); } return `${prefix}-${y}-${String(mx + 1).padStart(4, '0')}`; }
function wizSave(){
  const d = today(), id = uid(), tp = W.type;
  if (tp === 'exp'){
    const note = document.getElementById('w_note')?.value?.trim() || '';
    put('expenses', {id, d, cat: W.expcat, amount: W.amount, ship: W.shipLink || null, note});
    logIt('🧾', `${expNm(W.expcat)} ${money(W.amount)}${W.shipLink ? ' · ' + (ship(W.shipLink)?.ref || '') : ''}`);
  } else if (tp === 'sale' || tp === 'buy'){
    const amount = +sum(W.lines, l => l.qty * l.rate).toFixed(2), famount = +sum(W.lines, l => l.qty * l.frate).toFixed(2);
    const x = {id, d, type: tp, party: W.party, lines: W.lines, amount, famount, cur: W.cur, fx: fxOf(W.cur), terms: W.terms, due: addDays(d, W.terms), incoterm: tp === 'sale' ? W.incoterm : null};
    if (tp === 'sale') x.inv = nextNo(S.settings.invPrefix || 'INV', S.txns.filter(t => t.type === 'sale'), 'inv');
    else x.inv = nextNo('PB', S.txns.filter(t => t.type === 'buy'), 'inv');
    if (W.ship){
      const sid = uid(), out = tp === 'sale';
      put('ships', {id: sid, dir: out ? 'out' : 'in', party: W.party, country: W.country, lines: W.lines.map(l => ({item: l.item, qty: l.qty})), stage: 0, created: d, eta: addDays(d, W.eta), ref: nextNo(out ? 'EX' : 'IM', S.ships, 'ref'), pol: out ? 'Nhava Sheva' : cport(W.country), pod: out ? cport(W.country) : 'Nhava Sheva', docs: {inv: out}, txn: id});
      x.ship = sid;
    }
    put('txns', x);
    logIt(TYPE_IC[tp], `${TYPE_NM(tp)}: ${party(W.party)?.name} · ${linesTxt(x)} · ${money(amount)} · ${x.inv}`);
  } else {
    put('txns', {id, d, type: tp, party: W.party, amount: W.amount, famount: W.famount, cur: W.cur, fx: fxOf(W.cur), mode: W.mode});
    logIt(TYPE_IC[tp], `${TYPE_NM(tp)}: ${party(W.party)?.name} · ${fmoney(W.famount, W.cur)}`);
  }
  sheet = null; W = null; toast('✅ ' + T('हो गया!','Done!')); speak(T('हो गया','Done') + '. ' + TYPE_NM(tp));
}

let heard = '', listening = false, recog = null, dictDone = null;
const canListen = () => !!(dictCap || window.SpeechRecognition || window.webkitSpeechRecognition);
function startListen(onDone){
  heard = ''; listening = true;
  if (dictCap){
    dictCap.start({language: hi() ? 'hi-IN' : 'en-IN'}).catch(e => { listening = false; toast(e?.code === 'not_granted' ? T('माइक की इजाज़त नहीं मिली','Microphone not allowed') : T('सुन नहीं पाया','Could not listen')); renderSheet(); });
    dictDone = onDone; return;
  }
  const R = window.SpeechRecognition || window.webkitSpeechRecognition; if (!R){ listening = false; return; }
  recog = new R(); recog.lang = hi() ? 'hi-IN' : 'en-IN'; recog.interimResults = true; recog.continuous = false;
  recog.onresult = e => { heard = [...e.results].map(r => r[0].transcript).join(' '); const el = document.getElementById('heard'); if (el) el.textContent = heard; };
  recog.onend = () => { listening = false; onDone(heard); };
  recog.onerror = () => { listening = false; renderSheet(); };
  try{ recog.start(); }catch(e){ listening = false; }
}
function stopListen(){ if (dictCap) dictCap.stop().catch(() => {}); else if (recog) try{ recog.stop(); }catch(e){} }
function wireDictation(){
  dictCap.onPartial(({text}) => { const el = document.getElementById('heard'); if (el) el.textContent = (heard + ' ' + text).trim(); });
  dictCap.onFinal(({text}) => { heard = (heard + ' ' + text).trim(); const el = document.getElementById('heard'); if (el) el.textContent = heard; });
  dictCap.onState(({state}) => { if (state === 'idle' && listening){ listening = false; const f = dictDone; dictDone = null; if (f) f(heard); } });
}

/* rule-based understanding of a spoken sentence (works offline); Claude refines it when available */
function parseSpeech(text){
  const t = ' ' + text.toLowerCase().replace(/[,।?!]/g, ' ') + ' ';
  const has = re => re.test(t);
  const p = null, i = null;
  const goodsWord = has(/(किलो|kilo|kg|मीटर|meter|पीस|piece|pcs|बोरी|bori|bag|पेटी|peti|box|टन|ton|माल|maal)/);
  const itemHit = (() => { for (const o of S.items) for (const nm of [o.name, o.alias].filter(Boolean)) for (const w of nm.toLowerCase().split(/[\s()]+/)) if (w.length >= 3 && t.includes(w)) return true; return false; })();
  const money = !(goodsWord || itemHit) && has(/(पैस|रुपय|रुपए|रूपए|रुपये|paisa|paise|rupay|rupee|payment|पेमेंट|डॉलर|dollar|₹)/);
  let type = null;
  if (money){ type = has(/(मिला|मिले|आया|आए|जमा|received|got|mila|aaya|diye hame|दिए हमें)/) ? 'payIn' : has(/(दिया|दिए|भेजा|चुकाया|paid|gave|diya|bheja)/) ? 'payOut' : null; }
  else if (has(/(दिया|दिए|बेचा|भेजा|बेचे|sold|sale|gave|diya|becha|bheja|dispatch)/)) type = 'sale';
  else if (has(/(लिया|लिए|खरीदा|मँगाया|मंगाया|आया|bought|purchase|liya|kharida|mangaya|aaya)/)) type = 'buy';
  const nums = []; const re = /(\d+(?:\.\d+)?)\s*(हज़ार|हजार|hazar|hazaar|thousand|k\b|लाख|lakh|lac)?/g; let m;
  const t2 = t.replace(/(\d)[,](\d)/g, '$1$2');
  while ((m = re.exec(t2))){ let v = +m[1]; const u = m[2] || ''; if (/हज़ार|हजार|hazar|thousand|^k$/.test(u)) v *= 1000; if (/लाख|lakh|lac/.test(u)) v *= 1e5; nums.push(v); }
  const match = list => { let best = null, score = 0; for (const o of list){ for (const nm of [o.name, o.alias].filter(Boolean)){ const toks = nm.toLowerCase().split(/[\s()]+/).filter(w => w.length >= 3); let s = 0; for (const w of toks) if (t.includes(w)) s += w.length; if (t.includes(nm.toLowerCase())) s += 50; if (s > score){ score = s; best = o; } } } return best; };
  const pp = match(S.parties), ii = match(S.items);
  const out = {type, party: pp?.id || null, lines: [], amount: 0};
  if (type === 'sale' || type === 'buy'){ if (ii && nums[0]) out.lines.push({item: ii.id, qty: nums[0], rate: nums[1] || (type === 'sale' ? ii.sell : ii.buy)}); else if (ii) out.item = ii.id; }
  else if (nums.length) out.amount = Math.max(...nums);
  return out;
}

Types: "sale" (we gave/sold/sent goods), "buy" (we got/bought goods), "payIn" (someone paid us money), "payOut" (we paid money).
Use only ids from this data: ${JSON.stringify(ctx)}
Numbers may be words (e.g. "पाँच सौ" = 500, "दो हज़ार" = 2000, "1 लाख" = 100000). If a rate is not said, use the item's sell (sale) or buy (buy) price.
Return JSON only: {"type": "...", "party": "<id or null>", "lines": [{"item": "<id>", "qty": number, "rate": number}], "amount": number (payments only, in rupees)}.
Sentence: ${JSON.stringify(text)}`, {modelTier: 'quick'});

}

async function saveFile(name, data, mime){
  if (dl){ try{ await dl.save({filename: name, data: new Blob([data], {type: mime})}); toast('✅ ' + T('फ़ाइल सेव हुई','File saved')); }catch(e){ if (e?.code !== 'declined') toast('⚠️ ' + T('फ़ाइल सेव नहीं हुई','File not saved')); } return; }
  if (window.claude){ toast(T('यहाँ डाउनलोड नहीं हो सकता — ऊपर से कॉपी करो','Download is not available here — copy instead')); return; }
  try{ const u = URL.createObjectURL(new Blob([data], {type: mime})); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000); }catch(e){}
}
const csvCell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\n');
function csvOf(k){
  if (k === 'stock') return toCSV([['Item','Unit','Stock','Min','Days of stock','Incoming','Buy INR','Sell INR','HS code'], ...S.items.map(i => [i.name, i.unit, stockOf(i.id), i.min, C.days[i.id] === Infinity ? '' : C.days[i.id], C.incoming[i.id] || 0, i.buy, i.sell, i.hs || ''])]);
  if (k === 'parties') return toCSV([['Name','Type','Country','Phone','Currency','Balance INR (+ they owe us)','Overdue INR'], ...S.parties.map(p => [p.name, p.kind, p.country, p.phone, p.cur || 'INR', Math.round(C.bal[p.id] || 0), Math.round(C.pOver[p.id] || 0)])]);
  if (k === 'txns') return toCSV([['Date','Type','Doc no','Party','Goods','Currency','Foreign amount','Amount INR','Due','Status','Shipment'], ...S.txns.slice().sort((a, b) => a.d.localeCompare(b.d)).map(x => [x.d, x.type, x.inv || '', party(x.party)?.name || '', linesTxt(x).replace(/[^\p{L}\p{N}\s,.×()]/gu, '').trim(), x.cur || 'INR', x.famount ?? '', Math.round(x.amount || 0), x.due || '', C.inv[x.id]?.status || '', ship(x.ship)?.ref || ''])]);
  if (k === 'ships') return toCSV([['Ref','Direction','Party','Country','Stage','ETA','Vessel','Container','B/L','POL','POD','Docs ready'], ...S.ships.map(s => [s.ref, s.dir, party(s.party)?.name || '', s.country, ['Packing','Port','At sea','Customs','Delivered'][s.stage], s.eta, s.vessel || '', s.container || '', s.bl || '', s.pol || '', s.pod || '', DOCS.filter(d => (s.docs || {})[d[0]]).map(d => d[2]).join('; ')])]);
  if (k === 'expenses') return toCSV([['Date','Category','Amount INR','Shipment','Note'], ...S.expenses.map(e => [e.d, EXP[e.cat]?.[2] || e.cat, e.amount, ship(e.ship)?.ref || '', e.note || ''])]);
}

document.addEventListener('click', e => {
  const sEl = e.target.closest('[data-say]'); if (sEl && sEl.dataset.say) speak(sEl.dataset.say);
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'bg' && e.target !== el) return;
  const wasArmed = armed; if (!/^(del-|demo-load|clear)/.test(a)) armed = null;
  const top = () => { const s = document.querySelector('.sheet'); if (s) s.scrollTop = 0; };
  switch (a){
    case 'nav': view = el.dataset.v; sheet = null; scrollTo(0, 0); break;
    case 'more': sheet = {k: 'more'}; break;
    case 'lang': P.lang = hi() ? 'en' : 'hi'; savePrefs(); break;
    case 'voice': P.voice = !P.voice; savePrefs(); if (P.voice) setTimeout(() => speak(T('आवाज़ चालू','Voice on')), 50); break;
    case 'settings': sheet = {k: 'settings'}; break;
    case 'search': sheet = {k: 'search', q: ''}; setTimeout(() => document.getElementById('q')?.focus(), 30); break;
    case 'close': case 'bg': if (listening) stopListen(); sheet = null; W = null; break;
    case 'ship-tab': view = 'ships'; shipDir = el.dataset.d; break;
    case 'pfilter': partyFilter = el.dataset.f; break;
    case 'ifilter': invFilter = el.dataset.f; break;
    case 'ikind': invKind = el.dataset.k; break;
    case 'open-item': sheet = {k: 'item', id}; break;
    case 'open-party': sheet = {k: 'party', id}; break;
    case 'open-ship': sheet = {k: 'ship', id}; break;
    case 'open-inv': sheet = {k: 'inv', id, kind: el.dataset.k || 'inv'}; break;
    case 'inv-kind': sheet.kind = el.dataset.k; break;
    case 'inv-dl': { const x = S.txns.find(t => t.id === sheet.id); saveFile(`${(x.inv || 'document')}-${sheet.kind || 'inv'}.html`, fullDoc(x, sheet.kind || 'inv'), 'text/html'); return; }
    case 'inv-print': { const x = S.txns.find(t => t.id === sheet.id); const w = window.open('', '_blank'); if (w){ w.document.write(fullDoc(x, sheet.kind || 'inv')); w.document.close(); setTimeout(() => w.print(), 300); } return; }
    case 'ship-next': {
      const s = ship(id); if (!s || s.stage >= 4) break;
      const n = {...s, stage: s.stage + 1}; if (n.stage === 4 && n.eta > today()) n.eta = today();
      put('ships', n); logIt(STAGE_IC[n.stage], `${n.ref} → ${STAGES()[n.stage]}`);
      if (n.stage === 4 && n.dir === 'in') toast('🏬 ' + T('माल गोदाम में जुड़ गया','Goods added to godown'));
      setTimeout(() => speak(STAGES()[n.stage]), 50); break; }
    case 'doc-tog': { const s = ship(id); const docs = {...(s.docs || {})}; docs[el.dataset.k] = !docs[el.dataset.k]; put('ships', {...s, docs}); if (docs[el.dataset.k]) logIt('📑', `${s.ref}: ${DOCS.find(d => d[0] === el.dataset.k)[2]} ✅`); break; }
    case 'wiz': startWiz(el.dataset.type, el.dataset.party, el.dataset.ship ? {shipLink: el.dataset.ship} : null); break;
    case 'w-type': W.type = el.dataset.v; W.k = 1; onStep(); top(); break;
    case 'w-party': { W.party = el.dataset.v; const p = party(W.party); W.cur = p?.cur || 'INR'; W.terms = +(p?.terms ?? 30); W.k++; onStep(); top(); break; }
    case 'w-item': W.item = el.dataset.v; W.k++; onStep(); top(); break;
    case 'w-more': W.k = STEPS[W.type].indexOf('item'); onStep(); top(); break;
    case 'w-rmline': W.lines.splice(+el.dataset.k, 1); break;
    case 'w-cur': { const old = fxOf(W.cur); W.cur = el.dataset.v; if (+W.buf) W.buf = String(+((+W.buf * old) / fxOf(W.cur)).toFixed(W.cur === 'INR' ? 0 : 2)); for (const l of W.lines) l.frate = +(l.rate / fxOf(W.cur)).toFixed(4); break; }
    case 'w-terms': W.terms = +el.dataset.v; break;
    case 'w-inco': W.incoterm = el.dataset.v; break;
    case 'w-mode': W.mode = el.dataset.v; break;
    case 'w-expcat': W.expcat = el.dataset.v; W.k++; onStep(); top(); break;
    case 'w-link': W.shipLink = el.dataset.v || null; break;
    case 'w-ship': W.ship = el.dataset.v === '1'; break;
    case 'w-country': W.country = el.dataset.v; break;
    case 'w-eta': W.eta = +el.dataset.v; break;
    case 'w-next': if (!el.disabled) { wizNext(); top(); } break;
    case 'w-back': { const s = stepName(); if (s === 'cart' && W.lines.length){ const l = W.lines.pop(); W.item = l.item; W.qty = l.qty; W.k = STEPS[W.type].indexOf('qty'); } else if (s === 'item' && W.lines.length) W.k = STEPS[W.type].indexOf('cart'); else W.k = Math.max(0, W.k - 1); if (W.k === 0) W.type = null; onStep(); break; }
    case 'w-save': wizSave(); break;
    case 'np': npKey(el.dataset.k); renderSheet(); return;
    case 'adj': W = {buf: ''}; sheet = {k: 'adj', id, m: el.dataset.m, back: sheet}; break;
    case 'adj-why': sheet.why = el.dataset.v; break;
    case 'adj-save': { const i = item(sheet.id), q = +W.buf; if (!(q > 0)) break; const qty = sheet.m === 'in' ? q : -q;
      put('txns', {id: uid(), d: today(), type: 'adj', item: i.id, qty, why: sheet.why || 'count', amount: 0}); logIt('🔢', `${i.name} ${qty > 0 ? '+' : ''}${qtyFmt(qty)} ${i.unit}`);
      sheet = sheet.back; W = null; toast('✅ ' + T('हो गया','Done')); speak(T('हो गया','Done')); break; }
    case 'price': { const i = item(id); W = {buf: String(i.sell)}; sheet = {k: 'price', id, f: 'sell', back: sheet}; break; }
    case 'price-f': { const i = item(sheet.id); sheet.f = el.dataset.f; W.buf = String(sheet.f === 'sell' ? i.sell : i.buy); break; }
    case 'price-save': { const i = item(sheet.id), v = +W.buf; if (!(v > 0)) break; const n = {...i, [sheet.f]: v, hist: [...(i.hist || [])]}; const last = n.hist[n.hist.length - 1];

    case 'party-form': { const o = id ? party(id) : null; sheet = {k: 'partyForm', id: id || null, icon: o?.icon || '🏢', photo: o?.photo || null, kind: o?.kind || (W && (W.type === 'buy' || W.type === 'payOut') ? 'supplier' : 'customer'), ret: el.dataset.ret ? sheet : null, back: id ? sheet : null}; break; }
    case 'f-icon': sheet.icon = el.dataset.v; sheet.photo = null; renderSheet(); return;
    case 'f-kind': sheet.kind = el.dataset.v; renderSheet(); return;
    case 'del-txn': if (wasArmed === 'del-' + id){ const x = S.txns.find(t => t.id === id); if (x?.ship) remove('ships', x.ship); remove('txns', id); logIt('🗑️', `${T('मिटाया','Deleted')}: ${TYPE_NM(x.type)} ${x.inv || ''} ${money(x.amount || 0)}`); armed = null; } else armed = 'del-' + id; break;
    case 'del-exp': if (wasArmed === 'dx-' + id){ remove('expenses', id); armed = null; } else armed = 'dx-' + id; break;
    case 'del-item': if (wasArmed === 'del-item'){ const i = item(id); remove('items', id); logIt('🗑️', `${T('माल मिटाया','Item deleted')}: ${i?.name}`); sheet = null; armed = null; } else armed = 'del-item'; break;
    case 'del-party': if (wasArmed === 'del-party'){ const p = party(id); remove('parties', id); logIt('🗑️', `${T('मिटाया','Deleted')}: ${p?.name}`); sheet = null; armed = null; } else armed = 'del-party'; break;
    case 'demo-load': if (wasArmed === 'demo' || (!S.items.length && !S.parties.length)){ loadDemo(); armed = null; sheet = null; } else armed = 'demo'; break;
    case 'clear': if (wasArmed === 'clear'){ clearAll(); armed = null; sheet = null; } else armed = 'clear'; break;

    case 'lk-key': { const r = lockState.role, pin = S.settings.pins[r]; if (el.dataset.k === '⌫') lockState.buf = lockState.buf.slice(0, -1); else lockState.buf += el.dataset.k; lockState.err = false;
      if (lockState.buf.length >= pin.length){ if (lockState.buf === pin){ P.role = r; savePrefs(); setUnlocked(); lockState = null; view = 'home'; speak(T('स्वागत है','Welcome') + ' ' + roleNm(r)); } else { lockState.buf = ''; lockState.err = true; speak(T('गलत PIN','Wrong PIN')); } }
      renderLock(); return; }
    default: return;
  }
  render();
});
function startListenVoice(){
  startListen(async text => {
    if (!sheet || sheet.k !== 'voice') return;
    if (!text){ renderSheet(); return; }
    sheet.busy = true; renderSheet();
    const r = await understand(text); if (!sheet || sheet.k !== 'voice') return;
    sheet.busy = false; sheet.result = r; renderSheet();
    if (r.type) speak(TYPE_NM(r.type) + (r.party ? ', ' + party(r.party)?.name : '') + '. ' + T('सही है?','Is that right?'));
  });
  renderSheet();
}
document.addEventListener('submit', e => {
  e.preventDefault();
  const v = id => document.getElementById(id)?.value?.trim() ?? '';
  const f = e.target.id;
  if (f === 'itemF'){
    const o = sheet.id ? item(sheet.id) : null;
    const it = {...(o || {id: uid(), hist: [], open: +v('f_open') || 0}), name: v('f_name'), alias: v('f_alias'), icon: sheet.icon, photo: sheet.photo || null, unit: v('f_unit') || 'pcs', min: +v('f_min') || 0, buy: +v('f_buy') || 0, sell: +v('f_sell') || 0, pack: +v('f_pack') || 0, hs: v('f_hs'), wt: +v('f_wt') || 0};
    if (!o || o.buy !== it.buy || o.sell !== it.sell) it.hist = [...(it.hist || []).filter(h => h.d !== today()), {d: today(), sell: it.sell, buy: it.buy}];
    put('items', it); logIt('📦', `${o ? T('माल बदला','Item edited') : T('नया माल','New item')}: ${it.name}`);
    if (sheet.ret){ sheet = sheet.ret; W.item = it.id; W.k = STEPS[W.type].indexOf('qty'); onStep(); } else sheet = {k: 'item', id: it.id};
  } else if (f === 'partyF'){
    const o = sheet.id ? party(sheet.id) : null;
    const p = {...(o || {id: uid()}), name: v('f_name'), alias: v('f_alias'), icon: sheet.icon, photo: sheet.photo || null, phone: v('f_phone'), country: v('f_country'), kind: sheet.kind, cur: v('f_cur') || 'INR', terms: +v('f_terms') || 0, limit: +v('f_limit') || 0};
    put('parties', p); logIt('👥', `${o ? T('बदला','Edited') : T('नया','New')}: ${p.name}`);
    if (sheet.ret){ sheet = sheet.ret; W.party = p.id; W.cur = p.cur; W.terms = p.terms; W.k = 2; onStep(); } else sheet = {k: 'party', id: p.id};
  } else if (f === 'setF'){
    const st = S.settings; Object.assign(st, {company: v('s_co'), address: v('s_addr'), iec: v('s_iec'), gstin: v('s_gst'), bank: v('s_bank'), invPrefix: v('s_pref') || 'INV', rodtep: +v('s_rod') || 0, drawback: +v('s_dbk') || 0});
    for (const c of Object.keys(st.fx)) st.fx[c] = +v('fx_' + c) || st.fx[c];
    st.pins = {owner: v('pin_owner').replace(/\D/g, ''), munim: v('pin_munim').replace(/\D/g, ''), worker: v('pin_worker').replace(/\D/g, '')};
    putSettings(); logIt('⚙️', T('सेटिंग बदली','Settings changed')); sheet = null;
  } else if (f === 'shipF'){
    const s = ship(sheet.id); put('ships', {...s, vessel: v('s_vessel'), container: v('s_container'), bl: v('s_bl'), eta: v('s_eta') || s.eta, pol: v('s_pol'), pod: v('s_pod')}); logIt('🚢', `${s.ref}: ${T('जानकारी बदली','details updated')}`);
  } else if (f === 'searchF'){ return; }
  else if (f === 'aiF'){ const q = v('aiQ'); if (q){ document.getElementById('aiQ').value = ''; askAI(q); } return; }
  else return;
  toast('✅ ' + T('सेव हो गया','Saved')); speak(T('हो गया','Done')); render();
});
document.addEventListener('input', e => { if (e.target.id === 'q' && sheet?.k === 'search'){ sheet.q = e.target.value; renderSheet(); } });
document.addEventListener('change', e => {
  if (e.target.id === 'photoIn' && e.target.files[0]){
    const r = new FileReader(); r.onload = () => { const img = new Image(); img.onload = () => { const c = document.createElement('canvas'), s = 160, k = Math.max(s / img.width, s / img.height); c.width = c.height = s;
      c.getContext('2d').drawImage(img, (s - img.width * k) / 2, (s - img.height * k) / 2, img.width * k, img.height * k); sheet.photo = c.toDataURL('image/jpeg', .8); renderSheet(); }; img.src = r.result; }; r.readAsDataURL(e.target.files[0]);
  }
  if (e.target.id === 'restoreIn' && e.target.files[0]){ const r = new FileReader(); r.onload = () => restore(r.result); r.readAsText(e.target.files[0]); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (sheet || lockState) && !(lockState && needLock())){ sheet = null; W = null; lockState = null; render(); return; }
  const numScreen = W && W.buf !== undefined && sheet && (['adj','price'].includes(sheet.k) || (sheet.k === 'wiz' && ['qty','rate','amount'].includes(stepName())));
  if (numScreen && !/input|textarea|select/i.test(e.target.tagName)){
    if (/^[\d.]$/.test(e.key)){ npKey(e.key); renderSheet(); } else if (e.key === 'Backspace'){ npKey('⌫'); renderSheet(); } else if (e.key === 'Enter'){ document.querySelector('[data-act=w-next]:not([disabled]),[data-act=adj-save]:not([disabled]),[data-act=price-save]:not([disabled])')?.click(); }
  }
});

async function writeAll(data){
  for (const c of ['items','parties','txns','ships','expenses']) for (const o of data[c] || []) put(c, o);
  S.settings = Object.assign(defaultSettings(), data.settings || {}); putSettings();
}
async function clearAll(){
  const keep = S.settings;
  for (const c of COLLS) for (const o of [...S[c]]) remove(c, o.id);
  S.settings = Object.assign(defaultSettings(), {fx: keep.fx, rodtep: keep.rodtep, drawback: keep.drawback, pins: keep.pins}); putSettings();
  toast('🧹 ' + T('सब मिट गया — नया शुरू करो','All erased — start fresh'));
}
function loadDemo(){ const d = seed(); for (const c of COLLS){ const keep = new Set((d[c] || []).map(o => o.id)); for (const o of [...S[c]]) if (!keep.has(o.id)) remove(c, o.id); } writeAll(d); logIt('🧪', T('नमूना डेटा डाला','Sample data loaded')); toast('🧪 ' + T('नमूना डेटा आ गया','Sample data loaded')); }
function restore(text){
  try{ const d = JSON.parse(text); if (!d || !Array.isArray(d.items) || !Array.isArray(d.parties) || !Array.isArray(d.txns)) throw 0;
    for (const c of ['items','parties','txns','ships','expenses']){ const keep = new Set((d[c] || []).map(o => o.id)); for (const o of [...S[c]]) if (!keep.has(o.id)) remove(c, o.id); }
    writeAll({ships: [], expenses: [], ...d}); logIt('♻️', T('बैकअप वापस लाया','Backup restored')); sheet = null; toast('✅ ' + T('डेटा वापस आ गया','Data restored')); render(); }
  catch(e){ toast('🚫 ' + T('ये फ़ाइल सही बैकअप नहीं है','This file is not a valid backup')); }
}

/* ================= BOOT ================= */
async function boot(){
  if (window.claude && typeof window.claude.use === 'function'){
    loading = true; render();
    const use = n => window.claude.use(n).catch(() => null);
    [dl, sampleCap, dictCap, ttsCap, userCap] = await Promise.all([use('downloads'), use('sample'), use('dictation'), use('tts'), use('user')]);
    if (dictCap) wireDictation();
    db = await use('db');
    if (db){
      mode = 'cloud'; S = blank();
      if (userCap) try{ me = await userCap.me(); }catch(e){}
      let pending = COLLS.length + 1; const timer = setTimeout(() => { loading = false; loadFail = true; toast('⚠️ ' + T('डेटा धीरे आ रहा है…','Data is slow to load…')); schedule(); }, 10000);
      const done = () => { if (--pending <= 0){ clearTimeout(timer); loading = false; schedule(); } };
      for (const c of COLLS){ let first = true; const qy = c === 'log' ? db.collection(c).orderBy('at', 'desc').limit(300) : db.collection(c).limit(1000); qy.onSnapshot(snap => { S[c] = snap.docs.map(d => ({...d.data(), id: d.id})); if (first){ first = false; done(); } schedule(); }, err => { if (first){ first = false; done(); } toast('⚠️ ' + (err?.code || 'error')); }); }
      let firstS = true; db.doc('config/settings').onSnapshot(snap => { S.settings = Object.assign(defaultSettings(), snap.exists ? snap.data() : {}); if (firstS){ firstS = false; done(); if (needLock()) lockState = {role: null, buf: ''}; } schedule(); }, () => { if (firstS){ firstS = false; done(); } });
      return;
    }
    loading = false;
  }
  mode = 'local'; S = loadLocal() || seed(); saveLocal();
  if (needLock()) lockState = {role: null, buf: ''};
  render();
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};
if (!lockOn()) P.role = P.role || 'owner';
