<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6b78">
<title>Cargo Munim Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap">
<style>
/* Layout: SaaS admin shell — fixed white sidebar (sections + live-sync card), sticky top bar, content column of
   breadcrumb → page title → stat cards → data tables with search, sort and pagination; details open in a right-side drawer */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f8fafc; --hover:#f5f8ff; --border:#e3e8ef; --border-2:#eef1f6;
  --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --faint:#94a3b8;
  --primary:#2563eb; --primary-2:#1d4ed8; --primary-50:#eef4ff; --primary-100:#dbe7ff; --primary-ink:#ffffff;
  --success:#059669; --success-50:#ecfdf5; --success-200:#a7f3d0;
  --danger:#dc2626; --danger-50:#fef2f2; --danger-200:#fecaca;
  --warning:#d97706; --warning-50:#fffbeb; --warning-200:#fde68a;
  --teal:#0f766e; --teal-50:#f0fdfa; --violet:#6d28d9; --violet-50:#f5f3ff;
  --grad-blue:linear-gradient(135deg,#3b82f6,#1d4ed8); --grad-red:linear-gradient(135deg,#f87171,#dc2626);
  --grad-teal:linear-gradient(135deg,#2dd4bf,#0f766e); --grad-amber:linear-gradient(135deg,#fbbf24,#d97706);
  --grad-green:linear-gradient(135deg,#34d399,#059669); --grad-violet:linear-gradient(135deg,#a78bfa,#6d28d9);
  --paper:#ffffff; --paper-ink:#151515; --paper-line:#9a9a9a;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05); --shadow:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04); --shadow-lg:0 20px 40px -12px rgba(15,23,42,.25);
  --f-body:"Inter","Mukta","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --r-sm:8px; --sb:256px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1120; --surface:#111a2e; --surface-2:#0e1627; --hover:#16223b; --border:#1f2c45; --border-2:#1a263d;
  --ink:#e7edf7; --ink-2:#c3cee0; --muted:#8fa0ba; --faint:#64748b;
  --primary:#4f8bff; --primary-2:#3b74f0; --primary-50:#14244a; --primary-100:#1b3060; --primary-ink:#ffffff;
  --success:#34d399; --success-50:#0d2a22; --success-200:#14533f; --danger:#f87171; --danger-50:#2c1416; --danger-200:#5b2125;
  --warning:#fbbf24; --warning-50:#2a2110; --warning-200:#5a4512; --teal:#2dd4bf; --teal-50:#0d2826; --violet:#a78bfa; --violet-50:#1d1838;
  --shadow-sm:none; --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 20px 40px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1120; --surface:#111a2e; --surface-2:#0e1627; --hover:#16223b; --border:#1f2c45; --border-2:#1a263d;
  --ink:#e7edf7; --ink-2:#c3cee0; --muted:#8fa0ba; --faint:#64748b;
  --primary:#4f8bff; --primary-2:#3b74f0; --primary-50:#14244a; --primary-100:#1b3060; --primary-ink:#ffffff;
  --success:#34d399; --success-50:#0d2a22; --success-200:#14533f; --danger:#f87171; --danger-50:#2c1416; --danger-200:#5b2125;
  --warning:#fbbf24; --warning-50:#2a2110; --warning-200:#5a4512; --teal:#2dd4bf; --teal-50:#0d2826; --violet:#a78bfa; --violet-50:#1d1838;
  --shadow-sm:none; --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 20px 40px -12px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.i{flex:none;display:block}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}

/* ---------- sidebar ---------- */
.sidebar{position:fixed;top:env(safe-area-inset-top,0px);bottom:0;left:0;width:var(--sb);background:var(--surface);border-right:1px solid var(--border);z-index:40;display:flex;flex-direction:column;
  padding:20px 14px 16px;padding-left:max(14px,env(safe-area-inset-left,0px));transition:transform .2s ease}
.sb-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;border-bottom:1px solid var(--border-2);margin-bottom:14px}
.sb-logo{width:36px;height:36px;border-radius:10px;background:var(--grad-blue);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.sb-brand b{font-size:18px;font-weight:800;letter-spacing:-.3px;display:block;line-height:1.1}
.sb-brand small{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.sb-nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px}
.sb-sec{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.8px;text-transform:uppercase;padding:14px 10px 6px}
.sb-sec:first-child{padding-top:2px}
.sb-link{border:0;background:none;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink-2);text-align:left;width:100%}
.sb-link:hover{background:var(--hover);color:var(--ink)}
.sb-link .i{color:var(--muted)}
.sb-link.on{background:var(--grad-blue);color:#fff;box-shadow:0 4px 12px -4px rgba(37,99,235,.55)}
.sb-link.on .i{color:#fff}
.sb-link .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--danger-50);color:var(--danger);border-radius:99px;padding:1px 7px}
.sb-link.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.sync{border:1px solid var(--border);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;margin-top:12px;background:var(--surface-2)}
.sync-st{display:flex;gap:9px;font-size:12px;color:var(--muted);line-height:1.4}
.sync-st b{display:block;color:var(--ink);font-weight:600;font-size:12.5px}
.sync-st .i{color:var(--success);margin-top:1px}
.scrim{display:none}

/* ---------- top bar ---------- */
.app{margin-left:var(--sb);min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;gap:12px;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink-2);position:relative;flex:none}
.iconbtn:hover{background:var(--hover)}
.iconbtn.plain{border-color:transparent}
.iconbtn.on{color:var(--primary);background:var(--primary-50);border-color:var(--primary-100)}
.iconbtn.mic{background:var(--grad-blue);color:#fff;border-color:transparent}
.iconbtn .dot{position:absolute;top:5px;right:5px;min-width:17px;height:17px;border-radius:99px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--surface)}
.tb-title{font-size:17px;font-weight:700;letter-spacing:-.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-lang{font-weight:700;font-size:13px}
.user{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 6px;border-radius:10px;text-align:left}
.user:hover{background:var(--hover)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--grad-blue);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.avatar::after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:var(--success);border:2px solid var(--surface)}
.user b{display:block;font-size:13.5px;font-weight:600;line-height:1.2;white-space:nowrap}
.user small{display:block;font-size:12px;color:var(--muted)}
.hamb{display:none}

/* ---------- page ---------- */
main{flex:1;width:100%;max-width:1320px;margin:0 auto;padding-block:20px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;min-width:0}
.crumb{font-size:13px;color:var(--primary);font-weight:500;display:flex;gap:6px;align-items:center}
.crumb span{color:var(--faint)}
.page-hd{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-hd > div:first-child{flex:1;min-width:240px}
.page-hd h1{font-size:24px;font-weight:700;letter-spacing:-.4px;margin:4px 0 2px;line-height:1.2;text-wrap:balance}
.page-hd p{margin:0;color:var(--muted);font-size:13.5px}
.note{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--warning-200);background:var(--warning-50);color:var(--ink-2);border-radius:var(--r);padding:11px 14px;font-size:13.5px}
.note .i{color:var(--warning);margin-top:2px}
.note.info{border-color:var(--primary-100);background:var(--primary-50)} .note.info .i{color:var(--primary)}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{border:1px solid var(--border);background:var(--surface);border-radius:var(--r);padding:18px;display:flex;align-items:center;gap:16px;text-align:left;box-shadow:var(--shadow-sm);min-width:0}
button.stat:hover{border-color:var(--primary-100);box-shadow:var(--shadow)}
.stat-ic{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.stat-ic.blue{background:var(--grad-blue)} .stat-ic.red{background:var(--grad-red)} .stat-ic.teal{background:var(--grad-teal)}
.stat-ic.amber{background:var(--grad-amber)} .stat-ic.green{background:var(--grad-green)} .stat-ic.violet{background:var(--grad-violet)}
.stat-num{font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1.15;display:block;overflow-wrap:anywhere}
.stat-lbl{font-size:13.5px;color:var(--ink-2);font-weight:500;display:block}
.stat-sub{font-size:12px;color:var(--muted);display:block;margin-top:1px}
.stat-sub.bad{color:var(--danger);font-weight:600}
.stat > span:last-child{min-width:0}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.qa{border:1px solid var(--border);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:var(--shadow-sm);min-width:0}
.qa:hover{border-color:var(--primary-100);background:var(--hover)}
.qa b{display:block;font-size:14px;font-weight:600}
.qa small{display:block;font-size:12px;color:var(--muted)}
.sq{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.sq.blue{background:var(--primary-50);color:var(--primary)} .sq.amber{background:var(--warning-50);color:var(--warning)} .sq.green{background:var(--success-50);color:var(--success)}
.sq.red{background:var(--danger-50);color:var(--danger)} .sq.violet{background:var(--violet-50);color:var(--violet)} .sq.teal{background:var(--teal-50);color:var(--teal)} .sq.gray{background:var(--surface-2);color:var(--muted)}
.sq.sm{width:32px;height:32px;border-radius:8px}

/* cards & tables */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm);min-width:0}
.card-hd{display:flex;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap;border-bottom:1px solid var(--border-2)}
.card-hd h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.2px}
.card-bd{padding:16px 20px}
.count{font-size:12px;font-weight:600;color:var(--primary);background:var(--primary-50);border:1px solid var(--primary-100);border-radius:99px;padding:2px 10px}
.searchbox{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:0 12px;height:40px;background:var(--surface);color:var(--faint);min-width:min(280px,100%)}
.searchbox input{border:0;outline:0;background:none;font:inherit;color:var(--ink);width:100%;min-width:0}
.searchbox:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50)}
.tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:none;border-radius:7px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl th.r,.tbl td.r{text-align:right} .tbl th.c,.tbl td.c{text-align:center}
.tbl th .sortbtn{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;align-items:center;gap:4px}
.tbl th .sortbtn.on{color:var(--primary)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--border-2);vertical-align:middle}
.tbl td .cv{min-width:0}
.tb-title .short{display:none}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr.flag-bad td:first-child{box-shadow:inset 3px 0 0 var(--danger)}
.tbl tbody tr.flag-warn td:first-child{box-shadow:inset 3px 0 0 var(--warning)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .strong{font-weight:600;color:var(--ink)}
.cellp{display:flex;align-items:center;gap:10px;min-width:0}
.cellp > div{min-width:0}
.cell-main{font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.cell-sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.dt{display:inline-flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
.card-ft{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--border-2);flex-wrap:wrap;font-size:13px;color:var(--muted)}
.card-ft select{font:inherit;border:1px solid var(--border);border-radius:8px;padding:5px 8px;background:var(--surface);color:var(--ink)}
.pager{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.pager button{min-width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--ink-2);padding:0 6px}
.pager button.on{background:var(--grad-blue);color:#fff;border-color:transparent}
.pager button[disabled]{opacity:.4;cursor:default}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.status i{width:6px;height:6px;border-radius:50%;background:currentColor}
.status.good{color:var(--success);background:var(--success-50);border-color:var(--success-200)}
.status.bad{color:var(--danger);background:var(--danger-50);border-color:var(--danger-200)}
.status.warn{color:var(--warning);background:var(--warning-50);border-color:var(--warning-200)}
.status.info{color:var(--primary);background:var(--primary-50);border-color:var(--primary-100)}
.status.teal{color:var(--teal);background:var(--teal-50);border-color:var(--teal-50)}
.status.violet{color:var(--violet);background:var(--violet-50);border-color:var(--violet-50)}
.status.gray{color:var(--muted);background:var(--surface-2);border-color:var(--border)}
.open-btn{border:0;background:var(--grad-blue);color:#fff;border-radius:8px;padding:7px 12px 7px 14px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;box-shadow:0 2px 6px -2px rgba(37,99,235,.5)}
.open-btn:hover{filter:brightness(1.08)}
.mini-prog{display:flex;gap:3px;margin-top:6px;width:110px}
.mini-prog i{flex:1;height:4px;border-radius:4px;background:var(--border)}
.mini-prog i.on{background:var(--primary)} .mini-prog i.done{background:var(--success)}
.money-pos{color:var(--success);font-weight:700} .money-neg{color:var(--danger);font-weight:700}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}
.grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}

/* attention list */
.attn{display:flex;flex-direction:column}
.attn button{border:0;background:none;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border-2);width:100%}
.attn button:hover{background:var(--hover)}
.attn button:last-child{border-bottom:0}
.attn b{display:block;font-size:13.5px;font-weight:600}
.attn small{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.attn .i.chev{color:var(--faint);margin-left:auto}

/* reused building blocks */
.btn{border-radius:10px;min-height:40px;padding:8px 14px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1px solid var(--border);text-decoration:none;text-align:center;color:var(--ink-2)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--grad-blue);color:#fff;border-color:transparent;box-shadow:0 2px 8px -2px rgba(37,99,235,.5)}
.btn.good{background:var(--success);color:#fff;border-color:transparent}
.btn.bad{background:var(--surface);color:var(--danger);border-color:var(--danger-200)}
.btn.wa{background:#16a34a;color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.armed{background:var(--danger);color:#fff;border-color:transparent}
.btn.wide{width:100%}
.btn.sm{min-height:32px;font-size:12.5px;padding:4px 10px;border-radius:8px}
.btn.lg{min-height:52px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--border);white-space:nowrap}
.pill.good{background:var(--success-50);color:var(--success);border-color:var(--success-200)} .pill.bad{background:var(--danger-50);color:var(--danger);border-color:var(--danger-200)}
.pill.warn{background:var(--warning-50);color:var(--warning);border-color:var(--warning-200)} .pill.info,.pill.cargo{background:var(--primary-50);color:var(--primary);border-color:var(--primary-100)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:6px 12px;font-weight:600;font-size:13px;min-height:38px;display:flex;gap:6px;align-items:center;color:var(--ink-2)}
.seg button.on{background:var(--primary-50);color:var(--primary);border-color:var(--primary)}
.pic{width:44px;height:44px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.pic.sm{width:36px;height:36px;font-size:19px;border-radius:9px}
.pic.big{width:72px;height:72px;font-size:40px;border-radius:14px}
.bar{height:6px;border-radius:99px;background:var(--border-2);overflow:hidden;width:100%;max-width:140px}
.bar i{display:block;height:100%;background:var(--success);border-radius:99px}
.bar.low i{background:var(--danger)} .bar.mid i{background:var(--warning)}
.amt{font-weight:700;font-size:20px;letter-spacing:-.3px}
.amt.good{color:var(--success)} .amt.bad{color:var(--danger)}
.alert{border:1px solid var(--border);border-left:3px solid var(--warning);width:100%;text-align:left;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--surface);font-size:13.5px}
.alert.bad{border-left-color:var(--danger)} .alert.good{border-left-color:var(--success)} .alert.info{border-left-color:var(--primary)}

/* ================= Cargo Munim PRO =================
   Import / export ERP for people who may not read: pictures, colours, voice.
   Storage: in a claude.ai artifact with the `db` capability the whole team shares one live database;
   anywhere else (file opened on a desktop) data stays in this browser's localStorage. */
'use strict';
const DAY = 864e5;
const pad2 = n => String(n).padStart(2, '0');
const isoOf = dt => `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())}`;
const today = () => isoOf(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoOf(d); };

/* ---------- derived numbers (recomputed every render) ---------- */
let C = {};
const item = id => S.items.find(x => x.id === id);
const party = id => S.parties.find(x => x.id === id);
const ship = id => S.ships.find(x => x.id === id);
const fxOf = cur => cur === 'INR' || !cur ? 1 : (+S.settings.fx[cur] || 1);
function compute(){
  const stock = {}, sold60 = {}, incoming = {}, cut = addDays(today(), -60);
  for (const i of S.items){ stock[i.id] = +i.open || 0; sold60[i.id] = 0; incoming[i.id] = 0; }
  const shipBy = Object.fromEntries(S.ships.map(s => [s.id, s]));
  for (const x of S.txns){
    if (x.type === 'adj'){ if (x.item in stock) stock[x.item] += +x.qty || 0; continue; }
    if (x.type !== 'sale' && x.type !== 'buy') continue;
    const sh = x.ship ? shipBy[x.ship] : null;
    for (const l of x.lines || []){ if (!(l.item in stock)) continue;
      if (x.type === 'sale'){ stock[l.item] -= l.qty; if (x.d >= cut) sold60[l.item] += l.qty; }
      else if (!sh || sh.stage >= 4) stock[l.item] += l.qty; else incoming[l.item] += l.qty;
    }
  }
  const bal = {}, inv = {}, pOver = {};
  for (const p of S.parties){ bal[p.id] = 0; pOver[p.id] = 0; }
  const byP = groupBy(S.txns.filter(x => x.party), x => x.party);
  const alloc = (bills, paid) => { let rem = paid; for (const b of bills.sort((a, c) => a.d.localeCompare(c.d))){ const p = Math.min(b.amount, Math.max(0, rem)); rem -= p; const open = b.amount - p;
      inv[b.id] = {paid: p, open, status: open <= .5 ? 'paid' : p > .5 ? 'part' : 'unpaid', over: open > .5 && b.due && b.due < today() ? -daysFrom(b.due) : 0}; } };
  for (const [pid, xs] of Object.entries(byP)){
    let b = 0; for (const x of xs){ if (x.type === 'sale' || x.type === 'payOut') b += x.amount; else if (x.type === 'buy' || x.type === 'payIn') b -= x.amount; }
    bal[pid] = Math.abs(b) < 1 ? 0 : b;
    alloc(xs.filter(x => x.type === 'sale'), sum(xs.filter(x => x.type === 'payIn'), x => x.amount));
    alloc(xs.filter(x => x.type === 'buy'), sum(xs.filter(x => x.type === 'payOut'), x => x.amount));
    pOver[pid] = sum(xs.filter(x => x.type === 'sale' && inv[x.id]?.over > 0), x => inv[x.id].open);
  }
  const days = {}; for (const i of S.items){ const avg = sold60[i.id] / 60; days[i.id] = avg > 0 ? Math.max(0, Math.floor(stock[i.id] / avg)) : Infinity; }
  C = {stock, sold60, incoming, bal, inv, pOver, days};
}
const stockOf = id => C.stock[id] ?? 0;
const lineCost = l => (+l.cost || 0) * l.qty;
const expOfShip = sid => sum(S.expenses.filter(e => e.ship === sid), e => e.amount);

/* ---------- voice out ---------- */
function speak(text){
  if (!P.voice || !text) return;
  text = String(text).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}\u{1F1E6}-\u{1F1FF}]/gu, ' ').replace(/₹/g, '').trim();
  if (!text) return;
  const want = hi() ? 'hi' : 'en';
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const v = vs.find(v => (v.lang || '').toLowerCase().startsWith(want === 'hi' ? 'hi' : 'en-in')) || (want === 'en' ? vs.find(v => (v.lang || '').startsWith('en')) : null);
  if (!v && ttsCap){ ttsCap.speak(text.slice(0, 1900), {language: want}).catch(() => {}); return; }
  if (!window.speechSynthesis) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = want === 'hi' ? 'hi-IN' : 'en-IN'; u.rate = .95; if (v) u.voice = v; speechSynthesis.speak(u); }catch(e){}
}

const I = (n, s = 18) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

const sqIcon = (type, sm) => { const [ic, c] = TYPE_SQ[type] || ['file','gray']; return `<span class="sq ${c} ${sm ? 'sm' : ''}">${I(ic, sm ? 16 : 20)}</span>`; };
const EXP_IC = {freight:'ship', duty:'shield', cha:'file', insurance:'shield', transport:'truck', packing:'box', bank:'bank', other:'dots'};
const STAGE_SVG = ['box','anchor','ship','clip','ok'];

const cellP = (o, main, sub) => `<div class="cellp">${pic(o, 'sm')}<div><div class="cell-main">${main}</div>${sub ? `<div class="cell-sub">${sub}</div>` : ''}</div></div>`;
const stat = (ic, color, num, label, sub, attrs = '', say = '') => `<${attrs ? 'button' : 'div'} class="stat" ${attrs} ${say ? `data-say="${esc(say)}"` : ''}><span class="stat-ic ${color}">${I(ic, 24)}</span><span><span class="stat-num num">${num}</span><span class="stat-lbl">${label}</span>${sub ? `<span class="stat-sub ${sub.bad ? 'bad' : ''}">${sub.t || sub}</span>` : ''}</span></${attrs ? 'button' : 'div'}>`;

/* generic data table: search, sort, pagination, phone card layout */
function dataTable({id, title, cols, rows, search, ph, tools = '', rowAttrs, empty}){
  const s = ts(id); const q = s.q.trim().toLowerCase();
  let list = q && search ? rows.filter(r => search(r).toLowerCase().includes(q)) : rows.slice();
  const col = cols.find(c => c.k === s.sk);
  if (col && col.sort) list.sort((a, b) => { const x = col.sort(a), y = col.sort(b); return (x > y ? 1 : x < y ? -1 : 0) * s.sd; });
  const pages = Math.max(1, Math.ceil(list.length / s.per)); s.page = clamp(s.page, 1, pages);
  const slice = list.slice((s.page - 1) * s.per, s.page * s.per);
  const pg = []; for (let p = 1; p <= pages; p++){ if (p === 1 || p === pages || Math.abs(p - s.page) <= 1) pg.push(p); else if (pg[pg.length - 1] !== '…') pg.push('…'); }
  return `<section class="card">
    <div class="card-hd"><h2>${title}</h2><span class="count">${list.length} ${T('रिकॉर्ड','results')}</span><span class="sp"></span>${tools}
      ${search ? `<label class="searchbox">${I('search', 16)}<input data-tsearch="${id}" value="${esc(s.q)}" placeholder="${esc(ph || T('खोजो…','Search…'))}" aria-label="search"></label>` : ''}</div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map(c => `<th class="${c.cls || ''}">${c.sort ? `<button class="sortbtn ${s.sk === c.k ? 'on' : ''}" data-act="tsort" data-t="${id}" data-k="${c.k}">${c.label} ${I(s.sk === c.k ? (s.sd > 0 ? 'up' : 'down') : 'sort', 13)}</button>` : c.label}</th>`).join('')}</tr></thead>
    <tbody>${slice.map(r => `<tr ${rowAttrs ? rowAttrs(r) : ''}>${cols.map((c, k) => `<td class="${c.cls || ''} ${k === 0 ? 'lead' : ''} ${c.act ? 'act-cell' : ''}" data-label="${esc(c.label)}"><div class="cv">${c.cell(r)}</div></td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="lead"><div class="empty">${empty || T('अभी कुछ नहीं है','Nothing here yet')}</div></td></tr>`}</tbody></table></div>
    ${list.length > 10 || s.page > 1 ? `<div class="card-ft"><span>${T('एक पेज पर','Rows per page')}</span><select data-tper="${id}" aria-label="rows per page">${[10, 25, 50].map(n => `<option ${s.per === n ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <div class="pager"><button data-act="tpage" data-t="${id}" data-p="${s.page - 1}" ${s.page <= 1 ? 'disabled' : ''} aria-label="previous">${I('chev-l', 16)}</button>${pg.map(p => p === '…' ? `<button disabled>…</button>` : `<button class="${p === s.page ? 'on' : ''}" data-act="tpage" data-t="${id}" data-p="${p}">${p}</button>`).join('')}<button data-act="tpage" data-t="${id}" data-p="${s.page + 1}" ${s.page >= pages ? 'disabled' : ''} aria-label="next">${I('chev-r', 16)}</button></div></div>` : ''}
  </section>`;
}

/* ================= ALERTS ================= */
function alerts(){
  const a = [];
  for (const s of S.ships) if (s.stage < 4 && daysFrom(s.eta) < 0){ const p = party(s.party); a.push({sev: 'red', ic: 'clock', t: T('शिपमेंट लेट है','Shipment is late'), d: `${flag(s.country)} ${esc(s.ref)} · ${esc(p?.name)} · ${-daysFrom(s.eta)} ${T('दिन लेट','days late')}`, dsay: `${p?.name}, ${-daysFrom(s.eta)} ${T('दिन लेट','days late')}`, act: 'open-ship', id: s.id}); }
  if (seeMoney()) for (const x of S.txns) if (x.type === 'sale' && C.inv[x.id]?.over > 0){ const p = party(x.party); a.push({sev: 'red', ic: 'wallet', t: T('पैसा लेट है','Payment overdue'), d: `${esc(x.inv || '')} · ${esc(p?.name)} · ${money(C.inv[x.id].open)} · ${C.inv[x.id].over} ${T('दिन','days')}`, dsay: `${p?.name} ${T('से','from')} ${sayMoney(C.inv[x.id].open)}, ${C.inv[x.id].over} ${T('दिन से लेट','days late')}`, act: 'open-inv', id: x.id}); }
  if (seeMoney()) for (const x of S.txns) if (x.type === 'buy' && C.inv[x.id]?.open > .5 && x.due && daysFrom(x.due) <= 7){ const p = party(x.party), d = daysFrom(x.due); a.push({sev: d < 0 ? 'red' : 'amber', ic: 'cash', t: T('पैसा देना है','Payment due'), d: `${esc(p?.name)} · ${money(C.inv[x.id].open)} · ${d < 0 ? -d + ' ' + T('दिन लेट','days late') : d + ' ' + T('दिन में','days left')}`, dsay: `${p?.name} ${T('को','to')} ${sayMoney(C.inv[x.id].open)}`, act: 'open-party', id: x.party}); }
  for (const i of S.items){ const st = stockOf(i.id), d = C.days[i.id]; if (st < (+i.min || 0) || d < 15) a.push({sev: st < (+i.min || 0) ? 'red' : 'amber', ic: 'box', t: `${T('माल कम है','Low stock')}: ${esc(i.name)}`, d: `${qtyFmt(st)} ${esc(i.unit)} · ${daysTxt(d)}${C.incoming[i.id] ? ` · ${qtyFmt(C.incoming[i.id])} ${T('आ रहा','incoming')}` : ''}`, dsay: `${i.name}, ${qtyFmt(st)} ${i.unit} ${T('बचा','left')}`, act: 'open-item', id: i.id}); }
  for (const p of S.parties) if (seeMoney() && +p.limit > 0 && C.bal[p.id] > +p.limit) a.push({sev: 'red', ic: 'alert', t: T('उधार की सीमा पार','Credit limit crossed'), d: `${esc(p.name)} · ${money(C.bal[p.id])} / ${money(p.limit)}`, dsay: p.name, act: 'open-party', id: p.id});
  for (const s of S.ships) if (s.stage >= 2 && s.stage < 4 && !(s.docs || {}).bl) a.push({sev: 'amber', ic: 'file', t: T('कागज़ बाकी: Bill of Lading','Missing document: Bill of Lading'), d: `${flag(s.country)} ${esc(s.ref)}`, dsay: s.ref, act: 'open-ship', id: s.id});
  for (const s of S.ships) if (s.dir === 'in' && s.stage < 4 && daysFrom(s.eta) >= 0 && daysFrom(s.eta) <= 7){ const p = party(s.party); a.push({sev: 'blue', ic: 'in', t: T('माल जल्दी आने वाला है','Goods arriving soon'), d: `${flag(s.country)} ${esc(p?.name)} · ${daysFrom(s.eta)} ${T('दिन बाकी','days left')}`, dsay: `${p?.name}, ${daysFrom(s.eta)} ${T('दिन बाकी','days left')}`, act: 'open-ship', id: s.id}); }
  return a;
}
const alertRows = list => `<div class="attn">${list.map(a => `<button data-act="${a.act}" data-id="${a.id}" data-say="${esc(a.t + '. ' + a.dsay)}"><span class="sq ${a.sev}">${I(a.ic, 18)}</span><span style="min-width:0"><b>${a.t}</b><small>${a.d}</small></span>${I('chev-r', 16).replace('class="i"', 'class="i chev"')}</button>`).join('') || `<div class="empty">${I('ok', 28)}<div style="margin-top:6px">${T('सब ठीक है','All clear')}</div></div>`}</div>`;

/* ================= VIEWS ================= */
function linesTxt(x){ return (x.lines || []).map(l => { const i = item(l.item); return i ? `${i.icon} ${i.name} × ${qtyFmt(l.qty)} ${i.unit}` : ''; }).filter(Boolean).join(', '); }
function invStatus(x){
  const s = C.inv[x.id]; if (!s) return '';
  if (s.status === 'paid') return status('good', T('चुका दिया','Paid'));
  if (s.over > 0) return status('bad', `${T('लेट','Overdue')} ${s.over}${T(' दिन','d')}`);
  return s.status === 'part' ? status('warn', T('आधा मिला','Part paid')) : status('info', T('बाकी','Unpaid'));
}
function txnTable(id, list, title, showParty = true){
  const cols = [
    {k: 'd', label: T('तारीख','Date'), sort: x => x.at || x.d, cell: x => `<div class="cellp">${sqIcon(x.type, 1)}<div><div class="cell-main">${TYPE_NM(x.type)}</div><div class="cell-sub">${fmtDate(x.d)}</div></div></div>`},
    showParty ? {k: 'p', label: T('पार्टी','Party'), sort: x => party(x.party)?.name || '', cell: x => { const p = party(x.party); return p ? cellP(p, esc(p.name), `${flag(p.country)} ${esc(cname(p.country))}`) : '—'; }} : null,
    {k: 'doc', label: T('बिल नं.','Doc no.'), sort: x => x.inv || '', cell: x => `<span class="strong">${esc(x.inv || '—')}</span>`},
    {k: 'g', label: T('माल','Goods'), cell: x => x.type === 'adj' ? `${esc(item(x.item)?.name || '')} ${x.qty > 0 ? '+' : ''}${qtyFmt(x.qty)}` : `<span class="cell-sub" style="font-size:13px">${esc(linesTxt(x)) || (x.mode && MODES[x.mode] ? (hi() ? MODES[x.mode][1] : MODES[x.mode][2]) : '—')}</span>`},
    seeMoney() ? {k: 'a', label: T('रकम','Amount'), cls: 'r', sort: x => x.amount || 0, cell: x => x.amount ? `<div class="${x.type === 'sale' || x.type === 'payIn' ? 'money-pos' : 'money-neg'} num">${money(x.amount)}</div>${x.cur && x.cur !== 'INR' ? `<div class="cell-sub num">${fmoney(x.famount || x.amount / (x.fx || 1), x.cur)}</div>` : ''}` : '—'} : null,
    seeMoney() ? {k: 's', label: T('स्थिति','Status'), cell: x => invStatus(x) || status('gray', T('दर्ज','Recorded'))} : null,
    {k: 'act', label: T('काम','Action'), cls: 'r', act: 1, cell: x => (x.type === 'sale' || x.type === 'buy') && seeMoney() ? openBtn('open-inv', x.id) : x.party ? openBtn('open-party', x.party) : x.item ? openBtn('open-item', x.item) : ''}
  ].filter(Boolean);
  return dataTable({id, title, cols, rows: list, search: x => `${x.inv || ''} ${party(x.party)?.name || ''} ${linesTxt(x)} ${TYPE_NM(x.type)}`, ph: T('बिल नं., पार्टी, माल…','Doc no, party, goods…'),
    rowAttrs: x => `data-say="${esc(`${TYPE_NM(x.type)}. ${party(x.party)?.name || ''}. ${seeMoney() && x.amount ? sayMoney(x.amount) : ''}`)}" class="${C.inv[x.id]?.over > 0 ? 'flag-bad' : ''}"`});
}

V.home = () => {
  if (loading) return `<div class="empty-big"><span class="spin">${I('refresh', 28)}</span><b>${T('डेटा आ रहा है…','Loading data…')}</b></div>`;
  if (!S.items.length && !S.parties.length) return emptyStart();
  const out = S.ships.filter(s => s.dir === 'out' && s.stage < 4), inn = S.ships.filter(s => s.dir === 'in' && s.stage < 4);
  let lena = 0, dena = 0; for (const p of S.parties){ const b = C.bal[p.id]; if (b > 0) lena += b; else dena -= b; }
  const overdue = sum(Object.values(C.pOver)), m0 = today().slice(0, 7);
  const salesM = sum(S.txns.filter(x => x.type === 'sale' && x.d.startsWith(m0)), x => x.amount);
  const A = alerts();
  const said = `${T('लेना है','To receive')} ${sayMoney(lena)}. ${T('देना है','To pay')} ${sayMoney(dena)}. ${out.length} ${T('शिपमेंट जा रहे हैं','shipments going')}, ${inn.length} ${T('आ रहे हैं','coming')}. ${A.length} ${T('बातों पर ध्यान दो','items need attention')}.`;
  const transit = out.concat(inn).sort((a, b) => a.eta.localeCompare(b.eta));
  return `${pageHd([T('डैशबोर्ड','Dashboard')], T('डैशबोर्ड','Dashboard'), T('माल, पैसे और शिपमेंट का आज का हाल','Today’s overview of stock, money and shipments'),

  <div class="stats">
    ${seeMoney() ? stat('wallet', 'green', money(lena), T('लेना है','To receive'), overdue > 0 ? {t: `${money(overdue)} ${T('लेट','overdue')}`, bad: 1} : T('ग्राहकों से','from buyers'), `data-act="nav" data-v="money"`, T('लेना है','To receive') + ' ' + sayMoney(lena))
      + stat('cash', 'red', money(dena), T('देना है','To pay'), T('सप्लायरों को','to suppliers'), `data-act="nav" data-v="money"`, T('देना है','To pay') + ' ' + sayMoney(dena))
      + stat('trend', 'blue', money(salesM), T('इस महीने बिक्री','Sales this month'), `${S.txns.filter(x => x.type === 'sale' && x.d.startsWith(m0)).length} ${T('बिल','invoices')}`, `data-act="nav" data-v="reports"`, T('इस महीने बिक्री','Sales this month') + ' ' + sayMoney(salesM))
      : stat('box', 'blue', S.items.length, T('माल','Items'), '', `data-act="nav" data-v="stock"`) + stat('alert', 'red', A.filter(a => a.ic === 'box').length, T('माल कम है','Low stock'), '', `data-act="nav" data-v="stock"`)}
    ${stat('ship', 'teal', `${out.length + inn.length}`, T('शिपमेंट रास्ते में','Shipments in transit'), `${out.length} ${T('जा रहे','export')} · ${inn.length} ${T('आ रहे','import')}`, `data-act="nav" data-v="ships"`, `${out.length} ${T('जा रहे','going')}, ${inn.length} ${T('आ रहे','coming')}`)}

  </div>

};

V.stock = () => {

    {k: 'n', label: T('माल','Item'), sort: i => i.name.toLowerCase(), cell: i => cellP(i, esc(i.name), [i.hs ? 'HS ' + esc(i.hs) : '', i.alias ? esc(i.alias) : ''].filter(Boolean).join(' · '))},

    {k: 'd', label: T('कितने दिन का','Days left'), sort: i => C.days[i.id] === Infinity ? 1e9 : C.days[i.id], cell: i => { const d = C.days[i.id]; return d === Infinity ? `<span class="muted">—</span>` : `<span class="num ${d < 15 ? 'money-neg' : ''}">~${d} ${T('दिन','days')}</span>`; }},

  ${dataTable({id: 'stock', title: T('सारा माल','All items'), cols, rows: S.items, search: i => `${i.name} ${i.alias || ''} ${i.hs || ''}`, ph: T('माल का नाम, HS code…','Item name, HS code…'),

function routeSVG(s){
  const W0 = 520, H0 = 150, x1 = 50, x2 = 470, y = 105, cx = 260, cy = 10;
  const from = s.dir === 'out' ? (s.pol || 'Nhava Sheva') : (s.pol || cport(s.country)), to = s.dir === 'out' ? (s.pod || cport(s.country)) : (s.pod || 'Nhava Sheva');
  const fromC = s.dir === 'out' ? 'IN' : s.country, toC = s.dir === 'out' ? s.country : 'IN';
  const created = s.created || addDays(s.eta, -20), total = Math.max(1, (new Date(s.eta) - new Date(created)) / DAY), el = (new Date(today()) - new Date(created)) / DAY;
  const tByStage = [0.04, 0.15, 0.6, 0.92, 1][s.stage];
  const tt = s.stage === 4 ? 1 : s.stage === 2 ? clamp(el / total, 0.2, 0.88) : tByStage;
  const q = t => [(1 - t) ** 2 * x1 + 2 * (1 - t) * t * cx + t * t * x2, (1 - t) ** 2 * y + 2 * (1 - t) * t * cy + t * t * y];
  const [sx, sy] = q(tt), pts = []; for (let k = 0; k <= 30; k++){ const t = k / 30 * tt; pts.push(q(t).map(v => v.toFixed(1)).join(',')); }
  return `<div class="route"><svg viewBox="0 0 ${W0} ${H0}" role="img" aria-label="route">
    <rect class="sea" x="0" y="0" width="${W0}" height="${H0}" rx="12"/>
    <path class="path" d="M${x1},${y} Q${cx},${cy} ${x2},${y}"/><polyline class="done" points="${pts.join(' ')}"/>
    <circle class="port" cx="${x1}" cy="${y}" r="6"/><circle class="port" cx="${x2}" cy="${y}" r="6"/>
    <text x="${x1}" y="${y + 24}" text-anchor="start" class="pl">${flag(fromC)} ${esc(from)}</text>
    <text x="${x2}" y="${y + 24}" text-anchor="end" class="pl">${esc(to)} ${flag(toC)}</text>
    <text x="${sx}" y="${sy + 9}" text-anchor="middle" font-size="30">${s.stage >= 4 ? '✅' : s.stage <= 1 ? '📦' : '🚢'}</text>
    <text x="${W0 / 2}" y="${H0 - 6}" text-anchor="middle" class="ps">${esc(STAGES()[s.stage])} · ${fmtDate(s.eta)}</text>
  </svg></div>`;
}

function aging(type){
  const b = {notdue: 0, d30: 0, d60: 0, d90: 0, late: 0};
  for (const x of S.txns) if (x.type === type){ const s = C.inv[x.id]; if (!s || s.open <= .5) continue; const o = s.over;
    if (!o) b.notdue += s.open; else { b.late += s.open; if (o <= 30) b.d30 += s.open; else if (o <= 60) b.d60 += s.open; else b.d90 += s.open; } }
  return b;
}
function agingBars(b){

}
function monthChart(rows){
  const W0 = 560, H0 = 220, pl = 54, pr = 10, pt = 14, pb = 34, mx = Math.max(1, ...rows.flatMap(r => [r.rev, r.buy, r.exp])) * 1.1;
  const gw = (W0 - pl - pr) / rows.length, bw = Math.min(22, gw / 4.2), Y = v => pt + (1 - v / mx) * (H0 - pt - pb);
  const tick = [0, mx / 2, mx].map(v => `<line class="grid-l" x1="${pl}" x2="${W0 - pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end">${v >= 1e5 ? (v / 1e5).toFixed(1) + 'L' : Math.round(v / 1000) + 'k'}</text>`).join('');
  const bars = rows.map((r, k) => { const x0 = pl + k * gw + (gw - bw * 3 - 4) / 2; const mo = new Date(r.m + '-15').toLocaleDateString(hi() ? 'hi-IN' : 'en-IN', {month: 'short'});
    return [['rev', 'b-s'], ['buy', 'b-b'], ['exp', 'b-e']].map(([f, c], j) => `<rect class="${c}" x="${x0 + j * (bw + 2)}" y="${Y(r[f])}" width="${bw}" height="${Math.max(0, H0 - pb - Y(r[f]))}" rx="3"><title>${money(r[f])}</title></rect>`).join('') +
      `<text class="ax" x="${pl + k * gw + gw / 2}" y="${H0 - 18}" text-anchor="middle">${mo}</text><text class="lbl" x="${pl + k * gw + gw / 2}" y="${H0 - 4}" text-anchor="middle" style="fill:var(--${r.profit >= 0 ? 'good' : 'bad'})">${r.profit >= 0 ? '+' : '−'}${Math.abs(r.profit) >= 1e5 ? (Math.abs(r.profit) / 1e5).toFixed(1) + 'L' : Math.round(Math.abs(r.profit) / 1000) + 'k'}</text>`; }).join('');
  return `<div class="chart" style="box-shadow:none;padding:0"><svg viewBox="0 0 ${W0} ${H0}" role="img" aria-label="monthly chart">${tick}${bars}</svg>
  <div class="legend"><span><i style="background:var(--accent)"></i>${T('बिक्री','Sales')}</span><span><i style="background:var(--cargo)"></i>${T('खरीद','Purchases')}</span><span><i style="background:var(--muted)"></i>${T('खर्चे','Expenses')}</span><span style="color:var(--good);font-weight:700">+ ${T('नीचे = मुनाफ़ा','below = profit')}</span></div></div>`;

    <button data-act="adj" data-id="${i.id}" data-m="out" data-say="${T('माल गया','Stock out')}"><span class="sq red">${I('minus', 18)}</span>${T('माल गया','Stock out')}</button>
    ${seeMoney() ? `<button data-act="price" data-id="${i.id}" data-say="${T('भाव बदलो','Change price')}"><span class="sq blue">${I('tag', 18)}</span>${T('भाव बदलो','Change price')}</button>` : ''}

SH.party = () => {
  const p = party(sheet.id); if (!p) return closeMissing();
  const b = C.bal[p.id] || 0, tx = S.txns.filter(x => x.party === p.id).sort((a, c) => c.d.localeCompare(a.d)), ov = C.pOver[p.id];
  const aggItems = type => { const m = {}; for (const x of tx.filter(x => x.type === type)) for (const l of x.lines || []){ const r = m[l.item] = m[l.item] || {q: 0, a: 0}; r.q += l.qty; r.a += l.qty * l.rate; } return Object.entries(m).map(([iid, r]) => ({i: item(iid), ...r})).filter(r => r.i); };
  const rows = rs => `<div class="list">${rs.map(r => `<button class="li" data-act="open-item" data-id="${r.i.id}" data-say="${esc(r.i.name + ' ' + qtyFmt(r.q) + ' ' + r.i.unit)}">${pic(r.i, 'sm')}<div class="body"><div class="t1">${esc(r.i.name)}</div></div><div class="rt"><div class="num" style="font-weight:600">${qtyFmt(r.q)} ${esc(r.i.unit)}</div>${seeMoney() ? `<div class="t2 num">${money(r.a)}</div>` : ''}</div></button>`).join('')}</div>`;
  const given = aggItems('sale'), got = aggItems('buy'), ps = S.ships.filter(s => s.party === p.id && s.stage < 4);
  const openInv = tx.filter(x => x.type === 'sale' && C.inv[x.id]?.open > .5);
  const msg = p.country === 'IN' && hi()
    ? `नमस्ते ${p.name}, आपका ${money(b)} बकाया है${openInv.length ? ` (${openInv.map(x => x.inv).join(', ')})` : ''}। कृपया जल्दी भुगतान करें। धन्यवाद — ${S.settings.company || ''}`
    : `Dear ${p.name}, a payment of ${money(b)}${p.cur && p.cur !== 'INR' ? ` (≈ ${fmoney(b / fxOf(p.cur), p.cur)})` : ''} is pending${openInv.length ? ` against ${openInv.map(x => x.inv).join(', ')}` : ''}. Kindly arrange the remittance. Thank you — ${S.settings.company || ''}`;
  const wa = b > 0 ? waLink(p.phone, msg) : '';
  return drHd(esc(p.name), '', P.role !== 'worker' ? `<button class="x" data-act="party-form" data-id="${p.id}" aria-label="edit">${I('edit', 16)}</button>` : '') + `
  <div class="dr-hero">${pic(p, 'big')}<div><h3>${esc(p.name)}</h3><div class="muted">${flag(p.country)} ${esc(cname(p.country))}${p.phone ? ` · <span class="num" style="user-select:all">${esc(p.phone)}</span>` : ''}</div>
    <div class="row" style="gap:6px;margin-top:8px">${p.kind === 'customer' ? status('info', T('ग्राहक','Buyer')) : p.kind === 'supplier' ? status('violet', T('सप्लायर','Supplier')) : status('teal', T('दोनों','Both'))}${p.cur && p.cur !== 'INR' ? status('gray', p.cur) : ''}${ov > 0 ? status('bad', `${money(ov)} ${T('लेट','overdue')}`) : ''}</div></div></div>
  ${seeMoney() ? `<div class="kv" data-say="${esc(b > 0 ? T('ये हमें देंगे','They will pay us') + ' ' + sayMoney(b) : b < 0 ? T('हमें इन्हें देना है','We must pay them') + ' ' + sayMoney(b) : T('हिसाब बराबर','All settled'))}">
    <div><small>${b > 0 ? T('हमें मिलेगा','Receivable') : b < 0 ? T('हमें देना है','Payable') : T('बकाया','Balance')}</small><b class="${b > 0 ? 'good' : b < 0 ? 'bad' : ''} num">${money(b)}</b>${p.cur && p.cur !== 'INR' && b ? `<span class="muted num" style="font-size:12px">≈ ${fmoney(b / fxOf(p.cur), p.cur)}</span>` : ''}</div>
    <div><small>${T('लेट रकम','Overdue')}</small><b class="${ov > 0 ? 'bad' : ''} num">${money(ov)}</b></div>
    <div><small>${T('उधार दिन','Credit days')}</small><b class="num">${+p.terms || 0}</b></div><div><small>${T('उधार सीमा','Credit limit')}</small><b class="num">${+p.limit ? money(p.limit) : '—'}</b></div></div>
  ${wa ? `<a class="btn wa" href="${esc(wa)}" target="_blank" rel="noopener">${I('msg', 16)} ${T('WhatsApp पर पैसे की याद दिलाओ','Send WhatsApp payment reminder')}</a>` : ''}
  <div class="act-row">${['sale','buy','payIn','payOut'].map(k => `<button data-act="wiz" data-type="${k}" data-party="${p.id}" data-say="${esc(TYPE_NM(k))}">${sqIcon(k)}${TYPE_NM(k)}</button>`).join('')}</div>` : ''}
  ${ps.length ? `<h3 class="dr-sec">${T('रास्ते में शिपमेंट','Shipments in transit')}</h3><div class="list">${ps.map(s => `<button class="li" data-act="open-ship" data-id="${s.id}"><span class="flag">${flag(s.country)}</span><div class="body"><div class="t1">${esc(s.ref)}</div><div class="t2">${fmtDate(s.eta)}</div></div>${status(stageCls(s.stage), STAGES()[s.stage])}</button>`).join('')}</div>` : ''}

  ${seeMoney() ? txnTable('ledger-' + p.id, tx, T('हिसाब किताब','Ledger'), false) : ''}
  ${isOwner() ? `<button class="btn ${armed === 'del-party' ? 'armed' : 'bad'}" data-act="del-party" data-id="${p.id}">${I('trash', 16)} ${armed === 'del-party' ? T('पक्का? फिर दबाओ','Confirm delete') : T('पार्टी मिटाओ','Delete party')}</button>` : ''}`;
};

SH.ship = () => {

  const msg = `Shipment update ${s.ref}: ${['Packing','At port','At sea','In customs','Delivered'][s.stage]}. ETA ${s.eta}${s.vessel ? ', vessel ' + s.vessel : ''}${s.container ? ', container ' + s.container : ''}${s.bl ? ', B/L ' + s.bl : ''}. — ${S.settings.company || ''}`;
  const wa = waLink(p?.phone, msg);
  return drHd(esc(s.ref), s.dir === 'out' ? T('एक्सपोर्ट','Export') : T('इम्पोर्ट','Import')) + `
  ${routeSVG(s)}
  <div class="stepper">${st.map((n, k) => `<div class="stp ${k < s.stage ? 'done' : k === s.stage ? 'now' : ''}"><span class="d">${I(k < s.stage ? 'check' : STAGE_SVG[k], 18)}</span>${n}</div>`).join('')}</div>
  <div class="kv"><div><small>${T('पार्टी','Party')}</small><b>${esc(p?.name || '')}</b></div><div><small>${T('देश','Country')}</small><b>${flag(s.country)} ${esc(cname(s.country))}</b></div>
    <div><small>${T('पहुँचेगा','ETA')}</small><b class="num ${s.stage < 4 && dl0 < 0 ? 'bad' : ''}">${fmtDate(s.eta)}</b><span class="muted" style="font-size:12px">${s.stage >= 4 ? st[4] : dl0 < 0 ? -dl0 + ' ' + T('दिन लेट','days late') : dl0 + ' ' + T('दिन बाकी','days left')}</span></div>
    <div><small>${T('माल','Goods')}</small><b style="font-size:13.5px">${esc((s.lines || []).map(l => { const i = item(l.item); return i ? `${i.name} × ${qtyFmt(l.qty)} ${i.unit}` : ''; }).join(', '))}</b></div></div>
  <div class="row">${s.stage < 4 ? `<button class="btn pri" data-act="ship-next" data-id="${s.id}" data-say="${esc(T('अगला कदम','Next step') + ': ' + st[s.stage + 1])}">${I(STAGE_SVG[s.stage + 1], 16)} ${T('अगला कदम','Move to')}: ${st[s.stage + 1]}</button>` : ''}
    ${x && seeMoney() ? `<button class="btn" data-act="open-inv" data-id="${x.id}">${I('file', 16)} ${T('इनवॉइस','Invoice')}</button><button class="btn" data-act="open-inv" data-id="${x.id}" data-k="pl">${I('clip', 16)} ${T('पैकिंग लिस्ट','Packing list')}</button>` : ''}
    ${wa ? `<a class="btn wa" href="${esc(wa)}" target="_blank" rel="noopener">${I('msg', 16)} ${T('पार्टी को अपडेट','Update party')}</a>` : ''}</div>
  <section class="panel"><h3>${T('कागज़ात — जो तैयार है उस पर टिक करो','Documents — tick what is ready')}</h3>
  <div class="docchk">${DOCS.map(d => `<button class="${(s.docs || {})[d[0]] ? 'ok' : ''}" data-act="doc-tog" data-id="${s.id}" data-k="${d[0]}" data-say="${esc(d[2] + ' ' + ((s.docs || {})[d[0]] ? T('तैयार','ready') : T('बाकी','pending')))}">${I((s.docs || {})[d[0]] ? 'ok' : 'file', 16)}${d[2]}</button>`).join('')}</div></section>
  ${seeMoney() && s.dir === 'out' && x ? `<section class="panel" data-say="${esc(T('इस शिपमेंट का मुनाफ़ा','Profit on this shipment') + ' ' + sayMoney(rev - cost - e))}"><h3>${T('इस शिपमेंट का हिसाब','Shipment profit')}</h3>
    <div class="hbars">${[[T('बिक्री','Sale'), rev, 'good'], [T('माल की लागत','Cost of goods'), cost, 'cargo'], [T('खर्चे','Expenses'), e, 'bad']].map(r => `<div class="hb"><span class="nm">${r[0]}</span><span class="v">${money(r[1])}</span><span class="track2"><i class="${r[2]}" style="width:${rev ? Math.min(100, r[1] / rev * 100) : 0}%"></i></span></div>`).join('')}</div>
    <div class="row" style="border-top:1px solid var(--border-2);padding-top:10px"><b>${T('मुनाफ़ा','Profit')}</b><span class="sp"></span><span class="amt num ${rev - cost - e >= 0 ? 'good' : 'bad'}">${smoney(rev - cost - e)}</span></div></section>` : ''}
  ${seeMoney() ? `<section class="panel"><div class="row"><h3>${T('इस शिपमेंट के खर्चे','Expenses on this shipment')}</h3><span class="sp"></span><button class="btn sm" data-act="wiz" data-type="exp" data-ship="${s.id}">${I('plus', 14)} ${T('खर्चा जोड़ो','Add expense')}</button></div>
    <div class="list">${exps.map(e => `<div class="li"><span class="sq violet sm">${I(EXP_IC[e.cat] || 'receipt', 16)}</span><div class="body"><div class="t1">${esc(expNm(e.cat))}</div><div class="t2">${fmtDate(e.d)}${e.note ? ' · ' + esc(e.note) : ''}</div></div><span class="money-neg num">${money(e.amount)}</span></div>`).join('') || `<div class="empty">${T('कोई खर्चा नहीं','No expenses yet')}</div>`}</div></section>` : ''}
  <section class="panel"><h3>${T('शिप की जानकारी','Shipping details')}</h3>
  <form class="form" id="shipF"><div class="two">
    <label>${T('जहाज़ का नाम','Vessel')}<input id="s_vessel" value="${esc(s.vessel || '')}"></label>
    <label>Container No.<input id="s_container" value="${esc(s.container || '')}"></label>
    <label>B/L No.<input id="s_bl" value="${esc(s.bl || '')}"></label>
    <label>${T('पहुँचने की तारीख','Arrival date')}<input id="s_eta" type="date" value="${esc(s.eta)}"></label>
    <label>${T('लोडिंग पोर्ट','Port of loading')}<input id="s_pol" value="${esc(s.pol || '')}"></label>
    <label>${T('उतरने का पोर्ट','Port of discharge')}<input id="s_pod" value="${esc(s.pod || '')}"></label>
  </div><button class="btn pri" type="submit">${I('check', 16)} ${T('सेव करो','Save details')}</button></form></section>`;
};

SH.inv = () => {

  <div class="row"><div class="tabs">${kinds.map(([k, l]) => `<button class="${(sheet.kind || 'inv') === k ? 'on' : ''}" data-act="inv-kind" data-k="${k}">${l}</button>`).join('')}</div><span class="sp"></span>

  ${!S.settings.company ? `<div class="note">${I('alert', 16)}<span>${T('बिल पर अपनी कंपनी का नाम, पता, IEC, बैंक डालने के लिए सेटिंग में जाओ।','Add your company name, address, IEC and bank details in Settings to print them on documents.')}</span></div>` : ''}
  ${docHTML(x, sheet.kind || 'inv')}`;
};

/* ================= ENTRY WIZARD ================= */
SH.wiz = () => {
  const s = stepName(), steps = W.type ? STEPS[W.type] : STEPS.sale;
  const title = W.type ? TYPE_NM(W.type) : T('नई एंट्री','New entry');
  let body = '', canNext = false, hideNext = false;
  const q = (txt, extra = '') => `<h3 class="wz-q">${extra}${txt}</h3>`;
  if (s === 'type'){
    body = q(T('क्या हुआ?','What happened?')) + `<div class="bigchoice">${['sale','buy','payIn','payOut','exp'].map(k => `<button class="choice" data-act="w-type" data-v="${k}" data-say="${esc(TYPE_NM(k))}">${sqIcon(k)}<span style="min-width:0"><b>${TYPE_NM(k)}</b><small>${TYPE_SUB(k)}</small></span></button>`).join('')}</div>`; hideNext = true;
  } else if (s === 'party'){
    const list = S.parties.filter(p => W.type === 'sale' || W.type === 'payIn' ? p.kind !== 'supplier' : p.kind !== 'customer');
    body = q(T('किसके साथ?','With whom?')) + `<div class="pick">${list.map(p => { const b = C.bal[p.id] || 0; return `<button class="pk ${W.party === p.id ? 'on' : ''}" data-act="w-party" data-v="${p.id}" data-say="${esc(p.name)}">${pic(p)}${esc(p.name)}<small>${flag(p.country)} ${b ? `<span class="${b > 0 ? 'money-pos' : 'money-neg'}">${money(b)}</span>` : ''}</small></button>`; }).join('')}
      <button class="pk" data-act="party-form" data-ret="1"><span class="sq blue">${I('plus', 20)}</span>${T('नई पार्टी','New party')}</button></div>`; hideNext = true;
  } else if (s === 'item'){
    body = q(T('कौन सा माल?','Which item?')) + `<div class="pick">${S.items.map(i => `<button class="pk ${W.item === i.id ? 'on' : ''}" data-act="w-item" data-v="${i.id}" data-say="${esc(i.name + ', ' + qtyFmt(stockOf(i.id)) + ' ' + i.unit)}">${pic(i)}${esc(i.name)}<small class="num">${qtyFmt(stockOf(i.id))} ${esc(i.unit)}</small></button>`).join('')}
      <button class="pk" data-act="item-form" data-ret="1"><span class="sq blue">${I('plus', 20)}</span>${T('नया माल','New item')}</button></div>`; hideNext = true;
  } else if (s === 'qty'){
    const i = item(W.item), already = sum(W.lines.filter(l => l.item === i.id), l => l.qty), avail = stockOf(i.id) - already, over = W.type === 'sale' && +W.buf > avail;
    body = q(T('कितना माल?','How much?'), pic(i, 'sm')) + numpad(i.unit, `${T('गोदाम में','In stock')}: <b class="num">${qtyFmt(avail)} ${esc(i.unit)}</b>${+i.pack && +W.buf ? ` · ${Math.ceil(+W.buf / i.pack)} ${T('पैकेज','packages')}` : ''}`, true)
      + (over ? `<div class="note" style="border-color:var(--danger-200);background:var(--danger-50)">${I('alert', 16)}<b>${T('इतना माल गोदाम में नहीं है','Not enough stock in the godown')}</b></div>` : '');
    canNext = +W.buf > 0 && !over;
  } else if (s === 'rate'){
    const i = item(W.item), base = (+W.buf || 0) * fxOf(W.cur);
    body = q(T('एक का भाव कितना?','Price per unit?'), pic(i, 'sm')) + curChips() + numpad(CUR[W.cur].trim() + ' / ' + i.unit, `${T('कुल','Total')}: <b class="num">${fmoney(W.qty * (+W.buf || 0), W.cur)}</b>${W.cur !== 'INR' ? ` = ${money(W.qty * base)}` : ''}${W.type === 'sale' && base && base < i.buy ? `<br><span class="money-neg">${T('खरीद के भाव से कम!','Below buying price!')} (${money(i.buy)})</span>` : ''}`, true);
    canNext = +W.buf > 0;
  } else if (s === 'cart'){

    canNext = true;

    if (W.type === 'exp') body = q(`${esc(expNm(W.expcat))} — ${T('कितने पैसे?','How much?')}`, `<span class="sq violet sm">${I(EXP_IC[W.expcat] || 'receipt', 16)}</span>`) + numpad('₹', '', false);
    else { const b = C.bal[W.party] || 0, p = party(W.party);
      body = q(T('कितने पैसे?','How much?'), pic(p, 'sm')) + curChips() + numpad(CUR[W.cur].trim(), (b ? `${b > 0 ? T('ये हमें देंगे','They owe us') : T('हमें देना है','We owe them')}: <b class="num">${money(b)}</b>` : T('हिसाब बराबर','All settled')) + (W.cur !== 'INR' && +W.buf ? ` · = ${money(+W.buf * fxOf(W.cur))}` : ''), true)

    canNext = +W.buf > 0;
  } else if (s === 'expcat'){

  } else if (s === 'link'){
    const ships = S.ships.filter(x => x.stage < 4 || daysFrom(x.eta) > -45);
    body = q(T('किस शिपमेंट का खर्चा? (ज़रूरी नहीं)','Which shipment? (optional)')) + `<div class="pick">${[`<button class="pk ${!W.shipLink ? 'on' : ''}" data-act="w-link" data-v="" data-say="${T('ऑफ़िस','Office')}"><span class="sq gray">${I('bank', 20)}</span>${T('ऑफ़िस / कोई नहीं','Office / none')}</button>`].concat(ships.map(x => `<button class="pk ${W.shipLink === x.id ? 'on' : ''}" data-act="w-link" data-v="${x.id}" data-say="${esc(cname(x.country) + ' ' + x.ref)}"><span class="ic">${flag(x.country)}</span>${esc(x.ref)}<small>${esc(party(x.party)?.name || '')}</small></button>`)).join('')}</div>`;
    canNext = true;
  } else if (s === 'ship'){
    const sale = W.type === 'sale';
    body = q(sale ? T('माल कैसे गया?','How did the goods go?') : T('माल आ गया या रास्ते में है?','Arrived or on the way?')) + `<div class="bigchoice">
      <button class="choice ${W.ship === true ? 'on' : ''}" data-act="w-ship" data-v="1" data-say="${sale ? T('शिप से भेजा','Sent by ship') : T('रास्ते में है','On the way')}"><span class="sq blue">${I('ship', 20)}</span><span><b>${sale ? T('शिप / ट्रक से भेजा','Shipped (ship / truck)') : T('रास्ते में है','Still on the way')}</b><small>${T('शिपमेंट बनेगा','Creates a shipment')}</small></span></button>
      <button class="choice ${W.ship === false ? 'on' : ''}" data-act="w-ship" data-v="0" data-say="${sale ? T('यहीं दे दिया','Handed over here') : T('माल आ गया','Goods arrived')}"><span class="sq green">${I(sale ? 'users' : 'box', 20)}</span><span><b>${sale ? T('यहीं दे दिया','Handed over locally') : T('माल आ गया','Goods received')}</b><small>${sale ? T('कोई शिपमेंट नहीं','No shipment') : T('गोदाम में जुड़ेगा','Added to stock now')}</small></span></button></div>
      ${W.ship ? q(sale ? T('किस देश जा रहा है?','Destination country') : T('किस देश से आ रहा है?','Origin country')) + `<div class="pick sm">${COUNTRIES.map(c => `<button class="pk ${W.country === c[0] ? 'on' : ''}" data-act="w-country" data-v="${c[0]}" data-say="${esc(hi() ? c[1] : c[2])}"><span class="ic">${flag(c[0])}</span><small style="color:inherit;font-weight:600">${esc(hi() ? c[1] : c[2])}</small></button>`).join('')}</div>
      ${q(T('कितने दिन में पहुँचेगा?','Transit time'))}<div class="seg">${[5, 10, 20, 30, 45, 60].map(d => `<button class="${W.eta === d ? 'on' : ''}" data-act="w-eta" data-v="${d}" data-say="${d} ${T('दिन','days')}">${d} ${T('दिन','days')}</button>`).join('')}</div>` : ''}`;
    canNext = W.ship === false || (W.ship === true && !!W.country);
  } else if (s === 'confirm'){ body = q(T('एक बार देख लो','Review and confirm')) + confirmBody(); canNext = true; }
  const bar = W.k > 0 ? `<div class="bottom-bar"><button class="btn" data-act="w-back" data-say="${T('पीछे','Back')}">${I('chev-l', 16)} ${T('पीछे','Back')}</button><span class="sp"></span>
    ${hideNext ? '' : s === 'confirm' ? `<button class="btn good lg" style="flex:1" data-act="w-save" data-say="${T('पक्का करो','Confirm')}">${I('check', 18)} ${T('पक्का करो','Confirm & save')}</button>` : `<button class="btn pri lg" style="flex:1" data-act="w-next" ${canNext ? '' : 'disabled'} data-say="${T('आगे','Next')}">${T('आगे','Next')} ${I('chev-r', 16)}</button>`}</div>` : '';
  return drHd(title, W.type ? `${T('कदम','Step')} ${W.k + 1} / ${steps.length}` : '') + `<div class="steps">${steps.map((_, k) => `<i class="${k <= W.k ? 'on' : ''}"></i>`).join('')}</div>${body}${bar}`;
};

function render(){
  if (!lockOn() && P.role !== 'worker') P.role = 'owner';
  compute();
  document.documentElement.lang = P.lang;
  if (!V[view] || (!seeMoney() && ['money','invoices','expenses','reports'].includes(view))) view = 'home';
  const af = document.activeElement, tsid = af?.dataset?.tsearch, pos = tsid ? af.selectionStart : 0;

  const mic = document.getElementById('micBtn'); mic.innerHTML = I('mic', 18); mic.hidden = !canListen() || P.role === 'worker';

  document.getElementById('langBtn').textContent = hi() ? 'EN' : 'हि';

  const nm = mode === 'cloud' && me?.name ? me.name : (S.settings.company || T('कार्गो मुनीम','Cargo Munim'));
  document.getElementById('userBtn').innerHTML = `<span class="avatar">${esc(initials(nm))}</span><span class="who"><b>${esc(nm)}</b><small>${roleNm(P.role || 'owner')}</small></span>`;

  document.getElementById('main').innerHTML = V[view]();
  if (tsid){ const f = document.querySelector(`[data-tsearch="${tsid}"]`); if (f){ f.focus(); try{ f.setSelectionRange(pos, pos); }catch(e){} } }

function renderSheet(){
  const root = document.getElementById('sheetRoot');
  if (!sheet || !SH[sheet.k]){ root.innerHTML = ''; return; }
  const old = root.querySelector('.sheet'), sc = old ? old.scrollTop : 0, keepKey = old?.dataset.key === sheet.k + (sheet.id || '');
  const focus = document.activeElement && root.contains(document.activeElement) ? (document.activeElement.id || (document.activeElement.dataset.tsearch ? '#t:' + document.activeElement.dataset.tsearch : null)) : null;
  const vals = {}; root.querySelectorAll('input:not([type=file]),select,textarea:not([readonly])').forEach(x => { if (x.id) vals[x.id] = x.value; });
  const html = SH[sheet.k](); if (!html){ root.innerHTML = ''; return; }
  root.innerHTML = `<div class="sheet-bg" data-act="bg"><div class="sheet ${['inv','ship','party'].includes(sheet.k) ? 'xl' : ''}" role="dialog" aria-modal="true" data-key="${esc(sheet.k + (sheet.id || ''))}">${html}</div></div>`;
  const ns = root.querySelector('.sheet');
  if (keepKey){ ns.scrollTop = sc; for (const k in vals){ const x = document.getElementById(k); if (x && x.value !== vals[k]) x.value = vals[k]; } }
  if (focus){ const f = focus.startsWith('#t:') ? root.querySelector(`[data-tsearch="${focus.slice(3)}"]`) : document.getElementById(focus); if (f){ f.focus(); try{ f.setSelectionRange(f.value.length, f.value.length); }catch(e){} } }
}
document.addEventListener('input', e => { const id = e.target.dataset?.tsearch; if (id){ ts(id).q = e.target.value; ts(id).page = 1; if (e.target.closest('#sheetRoot')) renderSheet(); else render(); } });

/* ================= VOICE ENTRY + AI MUNIM ================= */
let heard = '', listening = false, recog = null, dictDone = null;
const canListen = () => !!(dictCap || window.SpeechRecognition || window.webkitSpeechRecognition);
function startListen(onDone){
  heard = ''; listening = true;
  if (dictCap){
    dictCap.start({language: hi() ? 'hi-IN' : 'en-IN'}).catch(e => { listening = false; toast(e?.code === 'not_granted' ? T('माइक की इजाज़त नहीं मिली','Microphone not allowed') : T('सुन नहीं पाया','Could not listen')); renderSheet(); });
    dictDone = onDone; return;
  }
  const R = window.SpeechRecognition || window.webkitSpeechRecognition; if (!R){ listening = false; return; }
  recog = new R(); recog.lang = hi() ? 'hi-IN' : 'en-IN'; recog.interimResults = true; recog.continuous = false;
  recog.onresult = e => { heard = [...e.results].map(r => r[0].transcript).join(' '); const el = document.getElementById('heard'); if (el) el.textContent = heard; };
  recog.onend = () => { listening = false; onDone(heard); };
  recog.onerror = () => { listening = false; renderSheet(); };
  try{ recog.start(); }catch(e){ listening = false; }
}
function stopListen(){ if (dictCap) dictCap.stop().catch(() => {}); else if (recog) try{ recog.stop(); }catch(e){} }
function wireDictation(){
  dictCap.onPartial(({text}) => { const el = document.getElementById('heard'); if (el) el.textContent = (heard + ' ' + text).trim(); });
  dictCap.onFinal(({text}) => { heard = (heard + ' ' + text).trim(); const el = document.getElementById('heard'); if (el) el.textContent = heard; });
  dictCap.onState(({state}) => { if (state === 'idle' && listening){ listening = false; const f = dictDone; dictDone = null; if (f) f(heard); } });
}

/* rule-based understanding of a spoken sentence (works offline); Claude refines it when available */
function parseSpeech(text){
  const t = ' ' + text.toLowerCase().replace(/[,।?!]/g, ' ') + ' ';
  const has = re => re.test(t);
  const p = null, i = null;
  const goodsWord = has(/(किलो|kilo|kg|मीटर|meter|पीस|piece|pcs|बोरी|bori|bag|पेटी|peti|box|टन|ton|माल|maal)/);
  const itemHit = (() => { for (const o of S.items) for (const nm of [o.name, o.alias].filter(Boolean)) for (const w of nm.toLowerCase().split(/[\s()]+/)) if (w.length >= 3 && t.includes(w)) return true; return false; })();
  const money = !(goodsWord || itemHit) && has(/(पैस|रुपय|रुपए|रूपए|रुपये|paisa|paise|rupay|rupee|payment|पेमेंट|डॉलर|dollar|₹)/);
  let type = null;
  if (money){ type = has(/(मिला|मिले|आया|आए|जमा|received|got|mila|aaya|diye hame|दिए हमें)/) ? 'payIn' : has(/(दिया|दिए|भेजा|चुकाया|paid|gave|diya|bheja)/) ? 'payOut' : null; }
  else if (has(/(दिया|दिए|बेचा|भेजा|बेचे|sold|sale|gave|diya|becha|bheja|dispatch)/)) type = 'sale';
  else if (has(/(लिया|लिए|खरीदा|मँगाया|मंगाया|आया|bought|purchase|liya|kharida|mangaya|aaya)/)) type = 'buy';
  const nums = []; const re = /(\d+(?:\.\d+)?)\s*(हज़ार|हजार|hazar|hazaar|thousand|k\b|लाख|lakh|lac)?/g; let m;
  const t2 = t.replace(/(\d)[,](\d)/g, '$1$2');
  while ((m = re.exec(t2))){ let v = +m[1]; const u = m[2] || ''; if (/हज़ार|हजार|hazar|thousand|^k$/.test(u)) v *= 1000; if (/लाख|lakh|lac/.test(u)) v *= 1e5; nums.push(v); }
  const match = list => { let best = null, score = 0; for (const o of list){ for (const nm of [o.name, o.alias].filter(Boolean)){ const toks = nm.toLowerCase().split(/[\s()]+/).filter(w => w.length >= 3); let s = 0; for (const w of toks) if (t.includes(w)) s += w.length; if (t.includes(nm.toLowerCase())) s += 50; if (s > score){ score = s; best = o; } } } return best; };
  const pp = match(S.parties), ii = match(S.items);
  const out = {type, party: pp?.id || null, lines: [], amount: 0};
  if (type === 'sale' || type === 'buy'){ if (ii && nums[0]) out.lines.push({item: ii.id, qty: nums[0], rate: nums[1] || (type === 'sale' ? ii.sell : ii.buy)}); else if (ii) out.item = ii.id; }
  else if (nums.length) out.amount = Math.max(...nums);
  return out;
}
async function understand(text){
  let r = parseSpeech(text);
  if (sampleCap){
    try{
      const ctx = {parties: S.parties.map(p => ({id: p.id, name: p.name, alias: p.alias || ''})), items: S.items.map(i => ({id: i.id, name: i.name, alias: i.alias || '', unit: i.unit, sell: i.sell, buy: i.buy}))};
      const j = await sampleCap.json(`You turn one spoken sentence from an Indian import/export trader (Hindi, Hinglish or English) into a ledger entry.
Types: "sale" (we gave/sold/sent goods), "buy" (we got/bought goods), "payIn" (someone paid us money), "payOut" (we paid money).
Use only ids from this data: ${JSON.stringify(ctx)}
Numbers may be words (e.g. "पाँच सौ" = 500, "दो हज़ार" = 2000, "1 लाख" = 100000). If a rate is not said, use the item's sell (sale) or buy (buy) price.
Return JSON only: {"type": "...", "party": "<id or null>", "lines": [{"item": "<id>", "qty": number, "rate": number}], "amount": number (payments only, in rupees)}.
Sentence: ${JSON.stringify(text)}`, {modelTier: 'quick'});
      if (j && typeof j === 'object' && STEPS[j.type]){
        r = {type: j.type, party: party(j.party) ? j.party : r.party, lines: Array.isArray(j.lines) ? j.lines.filter(l => item(l.item) && +l.qty > 0).map(l => ({item: l.item, qty: +l.qty, rate: +l.rate || 0})) : [], amount: +j.amount || 0};
      }
    }catch(e){}
  }
  return r;
}

function voiceToWizard(r){
  startWiz(r.type, r.party);
  if (r.type === 'sale' || r.type === 'buy'){
    if (r.lines.length){ W.lines = r.lines.map(l => { const i = item(l.item); return {item: l.item, qty: l.qty, frate: +(l.rate / fxOf(W.cur)).toFixed(2), rate: l.rate, cost: +i.buy || 0}; }); }
    if (!r.party) W.k = 1; else if (!W.lines.length){ W.k = 2; if (r.item) { W.item = r.item; W.k = 3; } } else W.k = STEPS[r.type].indexOf('cart');
  } else if (r.party){ W.k = 2; if (r.amount){ W.cur = 'INR'; W.amount = r.amount; W.famount = r.amount; } }
  onStep();
}

  if (!q || !sampleCap) return;
  chat.push({role: 'user', content: q}, {role: 'assistant', content: '…'}); renderSheet();
  const sys = `You are "Munim ji", the trusted accountant of a small Indian import/export firm. The person asking may not read well: answer in ${hi() ? 'simple spoken Hindi (Devanagari)' : 'simple English'}, in at most 4 short sentences, numbers in Indian style (lakh), no tables, no markdown, no emoji. Use only this live business data (amounts in INR): ${bizSummary()}`;
  const msgs = chat.slice(-9, -1).map(m => ({role: m.role, content: m.content}));
  while (msgs.length && msgs[0].role !== 'user') msgs.shift();
  msgs[0] = {role: 'user', content: sys + '\n\nQuestion: ' + msgs[0].content};
  try{
    const r = await sampleCap(msgs, {cache: false, onText: ({text}) => { chat[chat.length - 1].content = text; const b = document.querySelectorAll('.bub'); if (b.length) b[b.length - 1].textContent = text; }});
    chat[chat.length - 1].content = r.text; speak(r.text);
  }catch(e){ chat[chat.length - 1].content = e?.code === 'rate_limited' ? T('अभी बहुत सवाल हो गए, थोड़ी देर बाद पूछो।','Too many questions right now, try again shortly.') : T('अभी जवाब नहीं मिल पाया।','Could not get an answer right now.'); }
  renderSheet();
}

async function saveFile(name, data, mime){
  if (dl){ try{ await dl.save({filename: name, data: new Blob([data], {type: mime})}); toast('✅ ' + T('फ़ाइल सेव हुई','File saved')); }catch(e){ if (e?.code !== 'declined') toast('⚠️ ' + T('फ़ाइल सेव नहीं हुई','File not saved')); } return; }
  if (window.claude){ toast(T('यहाँ डाउनलोड नहीं हो सकता — ऊपर से कॉपी करो','Download is not available here — copy instead')); return; }
  try{ const u = URL.createObjectURL(new Blob([data], {type: mime})); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000); }catch(e){}
}
const csvCell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\n');
function csvOf(k){
  if (k === 'stock') return toCSV([['Item','Unit','Stock','Min','Days of stock','Incoming','Buy INR','Sell INR','HS code'], ...S.items.map(i => [i.name, i.unit, stockOf(i.id), i.min, C.days[i.id] === Infinity ? '' : C.days[i.id], C.incoming[i.id] || 0, i.buy, i.sell, i.hs || ''])]);
  if (k === 'parties') return toCSV([['Name','Type','Country','Phone','Currency','Balance INR (+ they owe us)','Overdue INR'], ...S.parties.map(p => [p.name, p.kind, p.country, p.phone, p.cur || 'INR', Math.round(C.bal[p.id] || 0), Math.round(C.pOver[p.id] || 0)])]);
  if (k === 'txns') return toCSV([['Date','Type','Doc no','Party','Goods','Currency','Foreign amount','Amount INR','Due','Status','Shipment'], ...S.txns.slice().sort((a, b) => a.d.localeCompare(b.d)).map(x => [x.d, x.type, x.inv || '', party(x.party)?.name || '', linesTxt(x).replace(/[^\p{L}\p{N}\s,.×()]/gu, '').trim(), x.cur || 'INR', x.famount ?? '', Math.round(x.amount || 0), x.due || '', C.inv[x.id]?.status || '', ship(x.ship)?.ref || ''])]);
  if (k === 'ships') return toCSV([['Ref','Direction','Party','Country','Stage','ETA','Vessel','Container','B/L','POL','POD','Docs ready'], ...S.ships.map(s => [s.ref, s.dir, party(s.party)?.name || '', s.country, ['Packing','Port','At sea','Customs','Delivered'][s.stage], s.eta, s.vessel || '', s.container || '', s.bl || '', s.pol || '', s.pod || '', DOCS.filter(d => (s.docs || {})[d[0]]).map(d => d[2]).join('; ')])]);
  if (k === 'expenses') return toCSV([['Date','Category','Amount INR','Shipment','Note'], ...S.expenses.map(e => [e.d, EXP[e.cat]?.[2] || e.cat, e.amount, ship(e.ship)?.ref || '', e.note || ''])]);
}

async function writeAll(data){
  for (const c of ['items','parties','txns','ships','expenses']) for (const o of data[c] || []) put(c, o);
  S.settings = Object.assign(defaultSettings(), data.settings || {}); putSettings();
}
async function clearAll(){
  const keep = S.settings;
  for (const c of COLLS) for (const o of [...S[c]]) remove(c, o.id);
  S.settings = Object.assign(defaultSettings(), {fx: keep.fx, rodtep: keep.rodtep, drawback: keep.drawback, pins: keep.pins}); putSettings();
  toast('🧹 ' + T('सब मिट गया — नया शुरू करो','All erased — start fresh'));
}
function loadDemo(){ const d = seed(); for (const c of COLLS){ const keep = new Set((d[c] || []).map(o => o.id)); for (const o of [...S[c]]) if (!keep.has(o.id)) remove(c, o.id); } writeAll(d); logIt('🧪', T('नमूना डेटा डाला','Sample data loaded')); toast('🧪 ' + T('नमूना डेटा आ गया','Sample data loaded')); }
function restore(text){
  try{ const d = JSON.parse(text); if (!d || !Array.isArray(d.items) || !Array.isArray(d.parties) || !Array.isArray(d.txns)) throw 0;
    for (const c of ['items','parties','txns','ships','expenses']){ const keep = new Set((d[c] || []).map(o => o.id)); for (const o of [...S[c]]) if (!keep.has(o.id)) remove(c, o.id); }
    writeAll({ships: [], expenses: [], ...d}); logIt('♻️', T('बैकअप वापस लाया','Backup restored')); sheet = null; toast('✅ ' + T('डेटा वापस आ गया','Data restored')); render(); }
  catch(e){ toast('🚫 ' + T('ये फ़ाइल सही बैकअप नहीं है','This file is not a valid backup')); }
}

/* ================= BOOT ================= */
async function boot(){
  if (window.claude && typeof window.claude.use === 'function'){
    loading = true; render();
    const use = n => window.claude.use(n).catch(() => null);
    [dl, sampleCap, dictCap, ttsCap, userCap] = await Promise.all([use('downloads'), use('sample'), use('dictation'), use('tts'), use('user')]);
    if (dictCap) wireDictation();
    db = await use('db');
    if (db){
      mode = 'cloud'; S = blank();
      if (userCap) try{ me = await userCap.me(); }catch(e){}
      let pending = COLLS.length + 1; const timer = setTimeout(() => { loading = false; loadFail = true; toast('⚠️ ' + T('डेटा धीरे आ रहा है…','Data is slow to load…')); schedule(); }, 10000);
      const done = () => { if (--pending <= 0){ clearTimeout(timer); loading = false; schedule(); } };
      for (const c of COLLS){ let first = true; const qy = c === 'log' ? db.collection(c).orderBy('at', 'desc').limit(300) : db.collection(c).limit(1000); qy.onSnapshot(snap => { S[c] = snap.docs.map(d => ({...d.data(), id: d.id})); if (first){ first = false; done(); } schedule(); }, err => { if (first){ first = false; done(); } toast('⚠️ ' + (err?.code || 'error')); }); }
      let firstS = true; db.doc('config/settings').onSnapshot(snap => { S.settings = Object.assign(defaultSettings(), snap.exists ? snap.data() : {}); if (firstS){ firstS = false; done(); if (needLock()) lockState = {role: null, buf: ''}; } schedule(); }, () => { if (firstS){ firstS = false; done(); } });
      return;
    }
    loading = false;
  }
  mode = 'local'; S = loadLocal() || seed(); saveLocal();
  if (needLock()) lockState = {role: null, buf: ''};
  render();
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};
if (!lockOn()) P.role = P.role || 'owner';
boot();
